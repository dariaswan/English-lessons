<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dear Diary · Mia &amp; Lia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #FBF3F1; --surface: #FFFFFF; --beige: #F2E8E1; --blush: #F6E1E3;
  --ink: #3B3034; --muted: #8E8186; --rose: #C46F7D; --blue: #5B7DB8; --line: #EADCDD;
  --good: #3F8F67; --goodbg: #E5F3EC; --bad: #C25B5B; --badbg: #F9E4E4; --dark: #3E3236;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Poppins', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1F1A1C; --surface: #2A2326; --beige: #3A3033; --blush: #43303A;
    --ink: #F3E9EA; --muted: #B7A8AD; --rose: #E591A0; --blue: #93ADDE; --line: #4A3D42;
    --good: #7CC9A0; --goodbg: #233A2F; --bad: #EE8E8E; --badbg: #462829; --dark: #120E10;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1F1A1C; --surface: #2A2326; --beige: #3A3033; --blush: #43303A;
  --ink: #F3E9EA; --muted: #B7A8AD; --rose: #E591A0; --blue: #93ADDE; --line: #4A3D42;
  --good: #7CC9A0; --goodbg: #233A2F; --bad: #EE8E8E; --badbg: #462829; --dark: #120E10;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; }
img { max-width: 100%; display: block; }
button { font: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 18px 20px 110px; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px)); }
.nav .in { max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.nav .count { flex: 1; text-align: center; font-size: 13px; color: var(--muted); }
.nav .bar { height: 4px; background: var(--beige); border-radius: 99px; margin-top: 6px; overflow: hidden; }
.nav .bar i { display: block; height: 100%; background: var(--rose); width: 0; transition: width .3s; }
.pbtn { border: 0; border-radius: 99px; padding: 11px 22px; cursor: pointer; min-height: 46px; background: var(--beige); color: var(--ink); }
.pbtn.next { background: var(--rose); color: #fff; font-weight: 500; }
.pbtn[disabled] { opacity: .35; cursor: default; }

/* type */
.kicker { color: var(--rose); font-size: 13px; font-weight: 500; letter-spacing: .02em; margin: 0 0 2px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.15; }
h1 em { color: var(--rose); }
h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin: 0 0 4px; line-height: 1.25; }
.lead { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
.pic { width: 100%; border-radius: 18px; object-fit: cover; }
.box { background: var(--beige); border-radius: 18px; padding: 16px 18px; }
.box.blush { background: var(--blush); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.qlist { list-style: none; margin: 0; padding: 0; counter-reset: q; }
.qlist li { counter-increment: q; position: relative; padding: 6px 0 6px 30px; }
.qlist li::before { content: counter(q, decimal-leading-zero); position: absolute; left: 0; top: 9px; font-size: 12px; color: var(--rose); }
.frames p { margin: 0 0 4px; font-style: italic; }
.badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); color: var(--rose); font-weight: 500; font-size: 13px; position: absolute; top: 10px; left: 10px; }
.rel { position: relative; }
.title { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; min-height: 60vh; }
@media (max-width: 640px) { .title { grid-template-columns: 1fr; min-height: 0; } }
.title p { color: var(--muted); }

/* reveal rows */
.row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; }
.row .n { color: var(--rose); font-size: 12px; width: 18px; }
.row .s { flex: 1 1 220px; }
.reveal { border: 2px dashed var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 6px 14px; cursor: pointer; min-width: 120px; min-height: 40px; }
.reveal.shown { border: 2px solid var(--good); background: var(--goodbg); color: var(--ink); }
.example { color: var(--muted); font-style: italic; padding: 0 14px 10px; }

/* flip cards */
.cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
.flip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 84px; cursor: pointer; padding: 10px; color: var(--ink); }
.flip .base { font-weight: 500; font-size: 19px; }
.flip .past { color: var(--muted); font-size: 14px; }
.flip.shown { background: var(--goodbg); border-color: var(--good); }
.flip.shown .past { color: var(--good); font-weight: 500; font-size: 18px; }

/* quiz */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.q .txt { margin-bottom: 8px; }
.q .txt .n { color: var(--rose); font-size: 12px; margin-right: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font-size: 16px; color: var(--ink); background: var(--beige); border: 2px solid transparent; border-radius: 12px; padding: 8px 14px; cursor: pointer; min-height: 44px; text-align: left; }
.opt.right, .opt.picked { background: var(--goodbg); border-color: var(--good); }
.opt.wrong { background: var(--badbg); border-color: var(--bad); text-decoration: line-through; }
.fb { font-size: 14px; margin-top: 6px; }
.fb:empty { display: none; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); } .fb.info { color: var(--muted); }

/* chart */
.chart { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.chart th { font-weight: 500; font-size: 15px; text-align: left; padding: 0 8px; }
.chart th.mia { color: var(--rose); } .chart th.lia { color: var(--blue); }
.chart td { background: var(--surface); padding: 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 15px; }
.chart td:first-child { border-left: 1px solid var(--line); border-radius: 12px 0 0 12px; }
.chart td:last-child { border-right: 1px solid var(--line); border-radius: 0 12px 12px 0; }
.chart .reveal { width: 100%; min-width: 0; text-align: left; font-size: 14px; }
.scroll { overflow-x: auto; }

/* spinner */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { background: var(--beige); border-radius: 99px; padding: 5px 14px; font-size: 15px; }
.chip.on { background: var(--rose); color: #fff; }
.spin { font-family: var(--serif); font-size: 22px; background: var(--surface); border: 2px dashed var(--rose); border-radius: 16px; padding: 16px 18px; margin: 12px 0; min-height: 70px; }
.btn { border: 0; background: var(--rose); color: #fff; border-radius: 99px; padding: 10px 20px; cursor: pointer; font-weight: 500; min-height: 44px; }
.btn.ghost { background: var(--beige); color: var(--ink); font-weight: 400; }

/* order */
.ev { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; text-align: left; color: var(--ink); }
.ev .num { width: 34px; height: 34px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 500; flex: none; }
.ev.set .num { border: 2px solid var(--rose); color: var(--rose); }
.ev.ok .num { border-color: var(--good); color: var(--good); background: var(--goodbg); }
.ev.no .num { border-color: var(--bad); color: var(--bad); background: var(--badbg); }

/* player */
.player { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 16px; }
.prow { display: flex; gap: 12px; align-items: center; }
.prow > img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex: none; }
.pmeta { flex: 1; min-width: 0; }
.pname { font-weight: 500; font-size: 15px; }
.ptime { font-size: 12px; color: var(--muted); }
.seek { height: 6px; background: var(--beige); border-radius: 99px; margin-top: 8px; cursor: pointer; position: relative; }
.seek i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--rose); border-radius: 99px; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--rose); color: #fff; font-size: 19px; cursor: pointer; flex: none; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sp { border: 0; background: var(--beige); color: var(--ink); border-radius: 99px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.sp.on { background: var(--rose); color: #fff; }
.sp.back5 { margin-left: auto; }

/* chat / transcript */
.chat { display: flex; gap: 12px; align-items: flex-start; }
.chat > img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; }
.bubble { background: var(--blush); border-radius: 4px 18px 18px 18px; padding: 14px 18px; font-size: 18px; line-height: 1.7; }
.banner { background: var(--dark); color: #fff; border-radius: 14px; padding: 14px 18px; text-align: center; font-style: italic; margin-top: 18px; }
.phrases { display: flex; flex-wrap: wrap; gap: 8px; background: var(--blush); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-style: italic; }
.phrases span::after { content: "·"; color: var(--rose); margin-left: 8px; }
.phrases span:last-child::after { content: ""; }

/* diary (student views) */
.diary { border-radius: 20px; padding: 14px; position: relative; }
.diary.lia { background: #1E1A1C; }
.diary.lia::before { content: ""; position: absolute; inset: 0; border-radius: 20px; opacity: .55;
  background-image: radial-gradient(#d8d2d4 .8px, transparent 1.2px), radial-gradient(#d8d2d4 .6px, transparent 1px);
  background-size: 9px 11px, 13px 7px; background-position: 0 0, 4px 3px; }
.diary.mia { background: #F3D3D9; }
.dpage { position: relative; background: #FFFDFB; color: #3B3034; border-radius: 10px; padding: 16px 18px 14px 46px; line-height: 30px; font-size: 18px;
  background-image: linear-gradient(90deg, transparent 32px, var(--margin) 32px, var(--margin) 33px, transparent 33px), repeating-linear-gradient(transparent 0 29px, var(--rule) 29px 30px);
  background-position: 0 0, 0 8px; }
.diary.lia .dpage { --margin: #9FB4D6; --rule: #DCE3EE; }
.diary.mia .dpage { --margin: #E7A3B1; --rule: #F1DCE0; font-family: var(--serif); font-style: italic; }
.dpage .day { font-size: 12px; color: #8E8186; line-height: 22px; font-style: normal; font-family: var(--sans); }
.dpage .dear { font-family: var(--serif); font-style: italic; font-size: 21px; }
.dpage p { margin: 0; }
.dpage .sign { font-family: var(--serif); font-style: italic; text-align: right; padding-right: 8px; }
.dpage .ava { float: right; width: 84px; height: 84px; border-radius: 50%; margin: 2px 0 6px 12px; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); object-fit: cover; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.words span { background: var(--beige); border-radius: 99px; padding: 4px 12px; font-size: 14px; }
.words b { font-weight: 500; }
.secret { background: var(--dark); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const view = document.getElementById('view');

/* ── reusable widgets ── */
function revealRows(items, example) {
  const w = h('div');
  if (example) w.appendChild(h('div', 'example', example));
  items.forEach(([s, ans], i) => {
    const r = h('div', 'row', `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="s">${s}</span>`);
    const b = h('button', 'reveal', 'tap to check'); b.type = 'button';
    b.addEventListener('click', () => { const on = b.classList.toggle('shown'); b.textContent = on ? ans : 'tap to check'; });
    r.appendChild(b); w.appendChild(r);
  });
  return w;
}

function quiz(items, tf) {
  const w = h('div');
  items.forEach((it, i) => {
    const q = h('div', 'q'); q.appendChild(h('div', 'txt', `<span class="n">${String(i + 1).padStart(2, '0')}</span>${it.q}`));
    const opts = h('div', 'opts'), fb = h('div', 'fb');
    if (tf) opts.style.flexWrap = 'nowrap';
    it.o.forEach((o, k) => {
      const b = h('button', 'opt', o); b.type = 'button'; if (tf) b.style.flex = '1';
      b.addEventListener('click', () => {
        if (it.a === undefined) { opts.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b)); fb.className = 'fb info'; fb.textContent = it.say || ''; return; }
        if (k === it.a) { opts.querySelectorAll('.opt').forEach(x => x.disabled = true); b.classList.add('right'); fb.className = 'fb ok'; fb.textContent = it.yes || 'Yes!'; }
        else { b.classList.add('wrong'); b.disabled = true; fb.className = 'fb no'; fb.textContent = 'Try again!'; }
      });
      opts.appendChild(b);
    });
    q.appendChild(opts); q.appendChild(fb); w.appendChild(q);
  });
  return w;
}

const players = {};
function stopAll() { Object.values(players).forEach(a => a.pause()); }
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';
let rate = 1;
function player(name, who, img, sub) {
  if (!players[name]) players[name] = new Audio(A[name + 'mp3']);
  const a = players[name];
  const box = h('div', 'player');
  box.innerHTML = `<div class="prow"><img src="${img}" alt="${who}"><div class="pmeta"><div class="pname">${who}</div><div class="ptime">${sub} · <span class="t">0:00</span></div><div class="seek"><i></i></div></div><button class="play" type="button" aria-label="Play">▶</button></div><div class="ctrl"></div>`;
  const play = box.querySelector('.play'), fill = box.querySelector('.seek i'), seek = box.querySelector('.seek'), t = box.querySelector('.t'), ctrl = box.querySelector('.ctrl');
  [0.6, 0.75, 0.9, 1, 1.2].forEach(r => {
    const b = h('button', 'sp' + (rate === r ? ' on' : ''), r + '×'); b.type = 'button';
    b.addEventListener('click', () => { rate = r; a.playbackRate = r; ctrl.querySelectorAll('.sp:not(.back5)').forEach(x => x.classList.toggle('on', x === b)); });
    ctrl.appendChild(b);
  });
  const bk = h('button', 'sp back5', '↺ 5s'); bk.type = 'button'; bk.addEventListener('click', () => { a.currentTime = Math.max(0, a.currentTime - 5); }); ctrl.appendChild(bk);
  const sync = () => { play.textContent = a.paused ? '▶' : '❚❚'; fill.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%'; t.textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration); };
  ['timeupdate', 'play', 'pause', 'ended', 'loadedmetadata'].forEach(ev => a.addEventListener(ev, sync));
  play.addEventListener('click', () => { if (a.paused) { a.playbackRate = rate; a.play(); } else a.pause(); });
  seek.addEventListener('click', e => { const r = seek.getBoundingClientRect(); if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration; });
  sync(); return box;
}

  let next = 1; const btns = [];
  ev.forEach(([t]) => {
    const b = h('button', 'ev', `<span class="num"></span><span>${t}</span>`); b.type = 'button'; btns.push(b);
    b.addEventListener('click', () => { if (b.dataset.n || next > 5) return; b.dataset.n = next; b.querySelector('.num').textContent = next; b.classList.add('set'); next++; });
    v.appendChild(b);
  });
  const row = h('div', null); row.style.cssText = 'display:flex;gap:8px;margin-top:6px';
  const chk = h('button', 'btn', 'Check'), rst = h('button', 'btn ghost', 'Start again'); chk.type = rst.type = 'button';
  chk.addEventListener('click', () => btns.forEach((b, i) => { b.classList.remove('ok', 'no'); if (b.dataset.n) b.classList.add(+b.dataset.n === ev[i][1] ? 'ok' : 'no'); }));

  row.appendChild(chk); row.appendChild(rst); v.appendChild(row);
});

/* ── student diary views ── */
function diaryView(key) {
  const d = DIARIES[key];
  document.getElementById('nav').classList.add('hidden');
  view.innerHTML = `<div class="secret">🤫 ${d.who} · Don’t show your partner!</div>
    <p class="kicker" style="color:${d.color}">${d.who}</p><h2>${d.name}’s diary</h2><p class="lead">Saturday night. Read the diary. Then tell your partner about ${d.name}’s day.</p>
    <div class="diary ${d.cls}"><div class="dpage"><img class="ava" src="${d.ava}" alt="${d.name}"><div class="day">Saturday</div><div class="dear">Dear Diary,</div>
    ${d.text.map(t => `<p>${t}</p>`).join('')}<p class="sign" style="color:${d.color}">${d.sign}</p></div></div>
    <div class="words">${d.words.map(([w, m]) => `<span><b>${w}</b> ${m}</span>`).join('')}</div>
    <div class="box" style="margin-top:16px"><p class="kicker" style="color:${d.color}">Get ready to tell your partner</p>
    <ol class="qlist"><li>What did ${d.name} wear?</li><li>How did she feel at the photoshoot?</li><li>How did Mum feel?</li><li>What did she do in the evening?</li><li>What was the best moment? The worst moment?</li></ol></div>`;
}

/* ── router ── */
let cur = 0;
function show(i) {
  stopAll();
  cur = Math.max(0, Math.min(S.length - 1, i));
  view.innerHTML = '';
  S[cur].fn(view);
  document.getElementById('count').textContent = (cur + 1) + ' / ' + S.length + ' · ' + S[cur].part;
  document.getElementById('barfill').style.width = (cur / (S.length - 1) * 100) + '%';
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('nextb').disabled = cur === S.length - 1;
  try { if (location.hash.slice(1) !== S[cur].id) history.replaceState(null, '', '#' + S[cur].id); } catch (e) {}
  window.scrollTo(0, 0);
}
function route() {
  let k = ''; try { k = location.hash.slice(1); } catch (e) {}
  if (DIARIES[k]) { diaryView(k); return; }
  document.getElementById('nav').classList.remove('hidden');
  const i = S.findIndex(s => s.id === k);
  show(i >= 0 ? i : 0);
}
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('nextb').addEventListener('click', () => show(cur + 1));
document.addEventListener('keydown', e => {
  if (DIARIES[location.hash.slice(1)]) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') show(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(cur - 1);
});
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (DIARIES[k] || S.findIndex(s => s.id === k) !== cur) route(); });
route();
</script>
