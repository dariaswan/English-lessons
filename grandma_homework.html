<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Grandma’s visit: homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EAF2FB; --card:#FFFFFF; --soft:#F4F7FC; --ink:#2B3445; --navy:#1B2A4A; --head:#1B2A4A; --headink:#FFFFFF;
  --muted:#7A8499; --line:#D3DCEA; --field:#E3E9FF; --fieldline:#B9C6F5; --or:#F26B1D; --ord:#C94C08; --peach:#FDE4D3;
  --ok:#1E8A55; --okbg:#DDF4E7; --bad:#D33A3A; --badbg:#FDE3E3;
  --ps:#DCE6FF; --psd:#3552B8; --pc:#D6F2E2; --pcd:#1E8A55; --past:#FFE2CC; --pastd:#C94C08; --comp:#EADFFB; --compd:#6B42B5; --adj:#FCDDEA; --adjd:#B8336A;
  --special:#FFF4D6; --specialline:#F2D27A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1729; --card:#16223A; --soft:#1C2A46; --ink:#E4EAF5; --navy:#C9D6F2; --head:#22345C; --headink:#FFFFFF;
  --muted:#93A0BA; --line:#2C3D60; --field:#22325A; --fieldline:#3A4F86; --or:#FF8540; --ord:#FF9A5E; --peach:#3A2618;
  --ok:#5BD39A; --okbg:#173A2B; --bad:#FF7A7A; --badbg:#432022;
  --ps:#1F2E57; --psd:#9DB3FF; --pc:#173A2B; --pcd:#6FD8A2; --past:#43291A; --pastd:#FFA571; --comp:#2E2450; --compd:#C3A6FF; --adj:#40213A; --adjd:#FF9CC6;
  --special:#3B3417; --specialline:#7A6A2A; color-scheme: dark; }}
:root[data-theme="dark"]{
  --bg:#0E1729; --card:#16223A; --soft:#1C2A46; --ink:#E4EAF5; --navy:#C9D6F2; --head:#22345C; --headink:#FFFFFF;
  --muted:#93A0BA; --line:#2C3D60; --field:#22325A; --fieldline:#3A4F86; --or:#FF8540; --ord:#FF9A5E; --peach:#3A2618;
  --ok:#5BD39A; --okbg:#173A2B; --bad:#FF7A7A; --badbg:#432022;
  --ps:#1F2E57; --psd:#9DB3FF; --pc:#173A2B; --pcd:#6FD8A2; --past:#43291A; --pastd:#FFA571; --comp:#2E2450; --compd:#C3A6FF; --adj:#40213A; --adjd:#FF9CC6;
  --special:#3B3417; --specialline:#7A6A2A; color-scheme: dark; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.hero{background:var(--head);color:var(--headink);border-radius:14px;padding:18px 22px 16px;position:relative;margin-bottom:22px}
.hero h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.01em}
.hero p{margin:2px 0 0;font-size:.78rem;color:#B8C3D9}
.hero .em{position:absolute;right:18px;top:14px;font-size:1.9rem}
.hero::after{content:"";position:absolute;left:18px;bottom:-5px;width:40%;height:4px;border-radius:3px;background:var(--or)}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:7px}
.sec .n{background:var(--head);color:#fff;font-weight:700;font-size:.72rem;border-radius:5px;padding:2px 7px}
.sec h2{margin:0;font-size:1rem;font-weight:700;color:var(--navy);flex:1}
.sec .k{font-size:.7rem;color:var(--muted)}
.task{display:flex;gap:9px;align-items:flex-start;margin:14px 0 9px}
.task .t{background:var(--peach);color:var(--ord);font-weight:700;font-size:.66rem;border-radius:5px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.task .q{font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input.f,textarea.f,select.f{font:inherit;font-size:.92rem;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:7px;padding:4px 9px;min-width:0}
input.f:focus,textarea.f:focus,button:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:2px solid var(--or);outline-offset:2px}
textarea.f{width:100%;resize:vertical;min-height:58px}
.f.ok{background:var(--okbg);border-color:var(--ok)} .f.bad{background:var(--badbg);border-color:var(--bad)}
.f.shown{background:var(--soft);border-color:var(--line);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--soft)}
.row:first-child{border-top:0}
.num{color:var(--or);font-weight:700;font-size:.8rem;min-width:18px}
.hint{color:var(--muted);font-style:italic;font-size:.85rem}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.opt{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:3px 12px;cursor:pointer}
.opt.sel{border-color:var(--navy);background:var(--soft);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:.8rem;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 11px;color:var(--ink)}
.chip.c{background:var(--peach);border-color:transparent;color:var(--ord)}
button.btn{font:inherit;font-weight:600;font-size:.88rem;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;background:var(--or);color:#fff}
button.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fb{font-size:.86rem;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
/* player */
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.player .pp{width:42px;height:42px;border-radius:50%;border:0;background:var(--or);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.player .bk{font:inherit;font-size:.75rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:3px 8px;cursor:pointer}
.player input[type=range]{flex:1;min-width:120px;accent-color:var(--or)}
.player .tm{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:78px}
.player .sp{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted)}
.player .sp button{font:inherit;font-size:.75rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:2px 7px;cursor:pointer}
.player .sp button.on{background:var(--head);border-color:var(--head);color:#fff}
.script{background:var(--soft);border-radius:12px;padding:12px 16px;margin-top:10px;font-size:.92rem}
.script p{margin:.4em 0}
.locked{font-size:.82rem;color:var(--muted);margin-top:8px}
@media (max-width:560px){.wrap{padding:14px 10px 50px}.hero h1{font-size:1.15rem}.opts{margin-left:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.prog{display:flex;align-items:center;gap:10px;margin:-4px 0 6px;font-size:.78rem;color:var(--muted)}
.prog .bar{flex:1;height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--or);width:0;transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;background:transparent;border:0;padding:0}
.pcard{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.pcard img{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--head);object-fit:cover;flex:none}
.pcard .say{font-size:.82rem;color:var(--muted);margin:1px 0 6px;line-height:1.4}
.pcard input{width:100%!important}

function gapEx(items,opts={}){
  const el=h('div',{class:'card'+(opts.cards?' cards':'')}); const inputs=[];
  items.forEach((it,i)=>{
    const inp=h('input',{class:'f',type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Answer '+(i+1),style:`width:${it.w||9}em`});

    }

function tickEx(items,opts={}){
  const el=h('div',{class:'card'}); const sel=items.map(()=>null); const groups=[];
  items.forEach((it,i)=>{
    const g=h('div',{class:'opts',role:'radiogroup','aria-label':it.q});
    const btns=it.o.map((o,j)=>{const b=h('button',{class:'opt',type:'button',role:'radio','aria-checked':'false'},o);
      b.onclick=()=>{if(g.dataset.locked)return;sel[i]=j;btns.forEach((x,k)=>{x.classList.toggle('sel',k===j);x.classList.remove('bad');x.setAttribute('aria-checked',k===j)});opts.onchange&&opts.onchange()};g.append(b);return b});
    groups.push({g,btns});
    el.append(h('div',{class:'row'},h('span',{class:'num'},i+1),h('span',{},it.q),g));
  });
  return{el,
    check(){let ok=0;items.forEach((it,i)=>{const {g,btns}=groups[i];btns.forEach(b=>b.classList.remove('ok','bad'));if(sel[i]===null)return;
      if(sel[i]===it.a){ok++;btns[sel[i]].classList.add('ok');g.dataset.locked=1}else btns[sel[i]].classList.add('bad')});return[ok,items.length]},
    show(){items.forEach((it,i)=>{const {g,btns}=groups[i];if(!g.dataset.locked){btns.forEach(b=>b.classList.remove('bad','sel'));btns[it.a].classList.add('ok');g.dataset.locked=1}})},
    lock(){groups.forEach(x=>x.g.dataset.locked=1)},
    values(){return sel.slice()},
    restore(v){if(v)v.forEach((j,i)=>{if(j!==null&&j!==undefined)groups[i].btns[j].click()})}};
}
