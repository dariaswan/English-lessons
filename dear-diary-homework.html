<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework · Mia’s secret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #FBF3F1; --surface: #FFFFFF; --beige: #F2E8E1; --blush: #F6E1E3;
  --ink: #3B3034; --muted: #8E8186; --rose: #C46F7D; --line: #EADCDD;
  --good: #3F8F67; --goodbg: #E5F3EC; --bad: #C25B5B; --badbg: #F9E4E4;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans: 'Poppins', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1F1A1C; --surface: #2A2326; --beige: #3A3033; --blush: #43303A;
    --ink: #F3E9EA; --muted: #B7A8AD; --rose: #E591A0; --line: #4A3D42;
    --good: #7CC9A0; --goodbg: #233A2F; --bad: #EE8E8E; --badbg: #462829;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1F1A1C; --surface: #2A2326; --beige: #3A3033; --blush: #43303A;
  --ink: #F3E9EA; --muted: #B7A8AD; --rose: #E591A0; --line: #4A3D42;
  --good: #7CC9A0; --goodbg: #233A2F; --bad: #EE8E8E; --badbg: #462829;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
img { max-width: 100%; display: block; }
button { font: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; padding: 0 18px 110px; }

/* progress */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 10px; }
.bar { height: 6px; background: var(--beige); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--rose); border-radius: 99px; transition: width .35s; }
.where { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px)); }
.nav .in { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.nav .hint { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.35; }
.back, .next { border: 0; border-radius: 99px; padding: 12px 20px; cursor: pointer; min-height: 46px; }
.back { background: var(--beige); color: var(--ink); }
.next { background: var(--rose); color: #fff; font-weight: 500; }
.next[disabled] { opacity: .4; cursor: not-allowed; }

/* type */
.kicker { color: var(--rose); font-size: 13px; font-weight: 500; margin: 12px 0 2px; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 4px; line-height: 1.25; }
.lead { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

/* hero */
.hero { position: relative; border-radius: 22px; overflow: hidden; margin-top: 8px; }
.hero img { width: 100%; aspect-ratio: 1 / .85; object-fit: cover; object-position: 50% 30%; }
.hero .cap { position: absolute; inset: auto 0 0 0; padding: 60px 20px 18px; background: linear-gradient(transparent, rgba(40, 24, 30, .8)); color: #fff; }
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.2; }
.hero p { margin: 4px 0 0; font-size: 14px; font-weight: 300; }
.rules { list-style: none; padding: 0; margin: 18px 0 0; }
.rules li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 15px; display: flex; gap: 12px; align-items: flex-start; }
.rules li span { font-size: 20px; line-height: 1.2; }

/* diary */
.diary { background: #1E1A1C; border-radius: 18px; padding: 12px; position: relative; margin-bottom: 18px; }
.diary::before { content: ""; position: absolute; inset: 0; border-radius: 18px; opacity: .55;
  background-image: radial-gradient(#d8d2d4 .8px, transparent 1.2px), radial-gradient(#d8d2d4 .6px, transparent 1px);
  background-size: 9px 11px, 13px 7px; background-position: 0 0, 4px 3px; }
.page { position: relative; background: #FFFDFB; color: #3B3034; border-radius: 10px; padding: 14px 16px 12px 42px; line-height: 28px; font-size: 16px;
  background-image: linear-gradient(90deg, transparent 30px, #9FB4D6 30px, #9FB4D6 31px, transparent 31px), repeating-linear-gradient(transparent 0 27px, #DCE3EE 27px 28px);
  background-position: 0 0, 0 6px; }
.page .day { font-size: 12px; color: #8E8186; line-height: 22px; }
.page .dear { font-family: var(--serif); font-style: italic; font-size: 19px; }
.page p { margin: 0; }
.page .sign { font-family: var(--serif); font-style: italic; color: #5B7DB8; text-align: right; padding-right: 8px; }
.page .pic { float: right; width: 70px; height: 70px; border-radius: 50%; margin: 2px 0 6px 10px; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); object-fit: cover; }
.scene { width: 100%; border-radius: 18px; margin-bottom: 14px; aspect-ratio: 1254 / 1134; object-fit: cover; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 18px; }
.words span { background: var(--beige); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.words b { font-weight: 500; }

/* questions */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px 14px; margin-bottom: 10px; transition: border-color .2s; }
.q.solved { border-color: var(--good); }
.q .txt { font-size: 15px; margin-bottom: 10px; }
.q .txt .n { color: var(--rose); font-size: 13px; margin-right: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts.tf .opt { flex: 1; text-align: center; }
.opt { font-size: 15px; color: var(--ink); background: var(--beige); border: 2px solid transparent; border-radius: 12px; padding: 9px 14px; cursor: pointer; min-height: 44px; text-align: left; }
.opt.right, .opt.picked { background: var(--goodbg); border-color: var(--good); }
.opt.wrong { background: var(--badbg); border-color: var(--bad); text-decoration: line-through; text-decoration-color: var(--bad); }
.opt[disabled] { cursor: default; }
.fb { font-size: 13px; margin-top: 8px; }
.fb:empty { display: none; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); } .fb.info { color: var(--muted); }
@keyframes shake { 20%, 60% { transform: translateX(-4px) } 40%, 80% { transform: translateX(4px) } }
.shake { animation: shake .35s; }

/* chat + builder */
.chat { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; }
.chat > img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; }
.bubble { background: var(--blush); border-radius: 4px 16px 16px 16px; padding: 10px 14px; font-size: 15px; }
.bubble .who { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mini { border: 0; background: var(--rose); color: #fff; border-radius: 99px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.build { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.build .stem { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.script { background: var(--surface); border: 2px dashed var(--rose); border-radius: 16px; padding: 16px 18px; font-family: var(--serif); font-size: 18px; line-height: 1.6; margin: 16px 0; }
.script .gap { color: var(--muted); }
.howto { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; position: relative; padding: 0 0 10px 34px; font-size: 15px; }
.howto li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--rose); color: #fff; font-size: 13px; display: grid; place-items: center; }
.tip { background: var(--beige); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

/* player */
.player { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 18px; }
.prow { display: flex; gap: 12px; align-items: center; }
.prow > img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex: none; }
.pmeta { flex: 1; min-width: 0; }
.pname { font-weight: 500; font-size: 15px; }
.ptime { font-size: 12px; color: var(--muted); }
.seek { height: 6px; background: var(--beige); border-radius: 99px; margin-top: 8px; cursor: pointer; position: relative; touch-action: none; }
.seek i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--rose); border-radius: 99px; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--rose); color: #fff; font-size: 19px; cursor: pointer; flex: none; display: grid; place-items: center; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.ctrl .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { border: 0; background: var(--beige); color: var(--ink); border-radius: 99px; padding: 6px 9px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--rose); color: #fff; }
.chip.back5 { margin-left: auto; white-space: nowrap; }
.ctrl .lbl { display: none; }
.scriptbox { margin-top: 12px; }
.scriptbtn { width: 100%; border: 2px solid var(--rose); background: transparent; color: var(--rose); border-radius: 12px; padding: 10px; font-weight: 500; cursor: pointer; }
.scriptnote { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.transcript { margin-top: 10px; background: var(--blush); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.65; }

/* end */
.result { background: var(--blush); border-radius: 20px; padding: 22px 20px; text-align: center; margin: 18px 0; }
.result .big { font-family: var(--serif); font-size: 46px; line-height: 1.1; }
.result .small { font-size: 13px; color: var(--muted); }
.result .rows { display: flex; justify-content: center; gap: 24px; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
.result .rows b { display: block; color: var(--ink); font-weight: 500; font-size: 17px; }
.again { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; margin-top: 18px; padding: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  <main id="view"></main>
</div>

    <div class="hint" id="hint"></div>
    <button class="next" id="next" type="button">Next</button>
  </div>
</nav>

const players = {};
function getAudio(name) {
  if (!players[name]) { const a = new Audio(AUDIO[name]); a.preload = 'auto'; players[name] = a; }
  return players[name];
}
function stopAll() { Object.values(players).forEach(a => { a.pause(); }); }
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';

function playerUI(name, who, img, sub) {
  const box = h('div', 'player');
  box.innerHTML = `<div class="prow"><img src="${img}" alt="${who}"><div class="pmeta"><div class="pname">${who}</div><div class="ptime">${sub} · <span class="t">0:00</span></div><div class="seek" role="slider" aria-label="Position" tabindex="0"><i></i></div></div><button class="play" type="button" aria-label="Play">▶</button></div>
  <div class="ctrl"><span class="lbl">Speed</span></div>`;
  const a = getAudio(name);
  const play = box.querySelector('.play'), fill = box.querySelector('.seek i'), seek = box.querySelector('.seek'), t = box.querySelector('.t');
  const ctrl = box.querySelector('.ctrl');
  [0.6, 0.75, 0.9, 1, 1.2].forEach(r => {
    const b = h('button', 'chip' + (S.rate === r ? ' on' : ''), r + '×'); b.type = 'button';
    b.addEventListener('click', () => { S.rate = r; save(); a.playbackRate = r; ctrl.querySelectorAll('.chip:not(.back5)').forEach(x => x.classList.toggle('on', x === b)); });
    ctrl.appendChild(b);
  });
  const back = h('button', 'chip back5', '↺ 5s'); back.type = 'button'; back.setAttribute('aria-label', 'Back 5 seconds');
  back.addEventListener('click', () => { a.currentTime = Math.max(0, a.currentTime - 5); });
  ctrl.appendChild(back);
  const sync = () => { play.textContent = a.paused ? '▶' : '❚❚'; play.setAttribute('aria-label', a.paused ? 'Play' : 'Pause');
    fill.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%'; t.textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration); };
  ['timeupdate', 'play', 'pause', 'ended', 'loadedmetadata'].forEach(ev => a.addEventListener(ev, sync));
  play.addEventListener('click', () => { if (a.paused) { stopAll(); a.playbackRate = S.rate; a.play(); } else a.pause(); });
  const seekTo = e => { const r = seek.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; if (a.duration) a.currentTime = Math.min(Math.max(x / r.width, 0), 1) * a.duration; };
  seek.addEventListener('click', seekTo);
  seek.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') a.currentTime -= 3; if (e.key === 'ArrowRight') a.currentTime += 3; });
  sync();
  return box;
}

function scriptUI(container, reason) {
  const box = h('div', 'scriptbox');
  if (reason) box.appendChild(h('p', 'scriptnote', reason));
  const btn = h('button', 'scriptbtn', S.scriptOpen ? 'Hide the script' : 'Read the script'); btn.type = 'button';
  const tr = h('div', 'transcript', MAY_TEXT); tr.hidden = !S.scriptOpen;
  btn.addEventListener('click', () => { S.scriptOpen = !S.scriptOpen; save(); tr.hidden = !S.scriptOpen; btn.textContent = S.scriptOpen ? 'Hide the script' : 'Read the script'; });
  box.appendChild(btn); box.appendChild(tr); container.appendChild(box);
}

/* ── quiz ── */
function quiz(pid, tf, onChange) {
  const wrap = h('div');
  Q[pid].forEach((it, i) => {
    const id = qid(pid, i), scored = it.a !== undefined;
    const q = h('div', 'q' + (S.solved[id] ? ' solved' : ''));
    q.appendChild(h('div', 'txt', `<span class="n">${i + 1}</span>${it.q}`));
    const opts = h('div', 'opts' + (tf ? ' tf' : '')), fb = h('div', 'fb');
    it.o.forEach((o, k) => {
      const b = h('button', 'opt', o); b.type = 'button';
      if (S.solved[id]) { b.disabled = true; if ((scored && k === it.a) || (!scored && S.solved[id] === o)) b.classList.add(scored ? 'right' : 'picked'); }
      b.addEventListener('click', () => {
        if (S.solved[id]) return;
        if (!scored || k === it.a) {
          S.solved[id] = scored ? true : o;
          if (scored && S.first[id] === undefined) S.first[id] = true;
          if (pid[0] === 'l') S.streak = 0;
          opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
          b.classList.add(scored ? 'right' : 'picked'); q.classList.add('solved');
          fb.className = 'fb ' + (scored ? 'ok' : 'info'); fb.textContent = scored ? (it.yes || 'Yes, that’s right!') : it.say;
        } else {
          if (S.first[id] === undefined) S.first[id] = false;
          b.classList.add('wrong'); b.disabled = true;
          q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake');
          fb.className = 'fb no'; fb.textContent = pid[0] === 'l' ? 'Not quite. Listen again and try again!' : 'Not quite. Try again!';
          if (pid[0] === 'l') { S.streak++; if (S.streak >= 3 && !S.scriptEarned) { S.scriptEarned = true;
            const pl = view.querySelector('.player'); if (pl && !pl.querySelector('.scriptbox')) scriptUI(pl, 'Three mistakes in a row – that’s OK! You can read the script now.'); } }
        }
        save(); onChange && onChange(); updateNav();
      });
      opts.appendChild(b);
    });
    q.appendChild(opts); q.appendChild(fb); wrap.appendChild(q);
  });
  return wrap;
}

/* ── pages ── */
function render() {
  stopAll();
  const p = PAGES[S.page];
  view.innerHTML = '';
  document.getElementById('barfill').style.width = (S.page / (PAGES.length - 1) * 100) + '%';
  document.getElementById('where-part').textContent = p.part;
  document.getElementById('where-num').textContent = S.page > 0 && S.page < PAGES.length - 1 ? 'Exercise ' + S.page + ' of ' + (PAGES.length - 2) : '';

  if (p.id === 'start') {
    view.innerHTML = `<div class="hero"><img src="${IMG.hero}" alt="Mia is recording a voice message with a secret smile"><div class="cap"><h1>Mia’s secret</h1><p>Homework · about 20 minutes</p></div></div>
    <ul class="rules">
      <li><span>👆</span>Tap the answers. One exercise on each page.</li>
      <li><span>🔁</span>A mistake? Try again! You can go to the next page when all the answers are right.</li>
      <li><span>📸</span>At the end, take a screenshot of your score and send it to your teacher.</li>
    </ul>`;
  }
  else if (p.id === 'r1' || p.id === 'r2') {
    view.appendChild(h('p', 'kicker', 'Reading'));
    view.appendChild(h('h2', null, p.title));
    view.appendChild(h('p', 'lead', p.lead));
    if (p.id === 'r1') view.insertAdjacentHTML('beforeend', `<img class="scene" src="${IMG.liaSunday}" alt="Lia on her bed with her diary, smiling">`);
    view.insertAdjacentHTML('beforeend', DIARY);
    view.appendChild(quiz(p.id, p.tf));
  }
  else if (p.id === 'speak') {
    view.appendChild(h('p', 'kicker', 'Speaking'));
    view.appendChild(h('h2', null, 'You are May'));
    view.appendChild(h('p', 'lead', 'Your best friend Mia sent you a voice message. Listen and answer her!'));
    const chat = h('div', 'chat');
    chat.innerHTML = `<img src="${IMG.mia}" alt="Mia"><div class="bubble"><div class="who"><span>Mia · voice message</span><button class="mini" type="button">▶ Listen</button></div>Hi May! Guess what? Last night I heard Mum and Dad. Dad said I’m “too sweet”! I was so angry. So at eleven o’clock I went to Lia’s room. She was in the bathroom, and her diary was on the bed. I read it! She thinks Mum loves me more. And she thinks I’m prettier than her. Ha! It was the most interesting book in the world. And … I took photos of it. Shh! It’s a secret. Call me!</div>`;
    const ma = getAudio('mia'), mb = chat.querySelector('.mini');
    const ms = () => { mb.textContent = ma.paused ? '▶ Listen' : '❚❚ Pause'; };
    ['play', 'pause', 'ended'].forEach(ev => ma.addEventListener(ev, ms));
    mb.addEventListener('click', () => { if (ma.paused) { stopAll(); ma.playbackRate = 1; ma.play(); } else ma.pause(); });
    view.appendChild(chat);
    view.appendChild(h('p', 'kicker', '1. Make your answer — tap one option in each line'));
    LINES.forEach((ln, i) => {
      const box = h('div', 'build'); box.appendChild(h('div', 'stem', ln.stem));
      const opts = h('div', 'opts');
      ln.o.forEach(o => {
        const b = h('button', 'opt' + (S.picks[i] === o ? ' picked' : ''), o); b.type = 'button';
        b.addEventListener('click', () => { S.picks[i] = o; save(); opts.querySelectorAll('.opt').forEach(x => x.classList.toggle('picked', x === b)); drawScript(); updateNav(); });
        opts.appendChild(b);
      });
      box.appendChild(opts); view.appendChild(box);
    });
    const sc = h('div', 'script'); sc.setAttribute('aria-live', 'polite'); view.appendChild(sc);
    function drawScript() {
      const g = '<span class="gap">…</span>', k = S.picks;
      sc.innerHTML = 'Hi Mia! I listened to your message. ' + (k[0] || g) + ' You read Lia’s diary? ' + (k[1] || g) + ' ' + (k[2] || g) + ' ' + (k[3] || g) + ' ' + (k[4] || g) + ' Call me later. Bye!';
    }
    drawScript();
    view.appendChild(h('p', 'kicker', '2. Record it'));
    view.insertAdjacentHTML('beforeend', `<ol class="howto"><li>Read your answer aloud two or three times.</li><li>Record a voice message in Telegram or WhatsApp and send it to your teacher.</li><li>Bonus: add one more sentence of your own!</li></ol>
      <div class="tip">Don’t worry about mistakes. You can record it again and again before you send it.</div>`);
  }
  else if (p.id[0] === 'l') {
    view.appendChild(h('p', 'kicker', 'Listening'));
    view.appendChild(h('h2', null, p.title));
    view.appendChild(h('p', 'lead', p.lead));
    const pl = playerUI('may', 'May', IMG.may, 'voice message');
    view.appendChild(pl);
    if (S.scriptEarned) scriptUI(pl, 'Three mistakes in a row – that’s OK! You can read the script now.');
    view.appendChild(quiz(p.id, p.tf, () => { if (listeningDone() && !pl.querySelector('.scriptbox')) scriptUI(pl, 'All correct! Now read the script and listen one more time.'); }));
    if (listeningDone() && !S.scriptEarned) scriptUI(pl, 'All correct! Now read the script and listen one more time.');
  }
  else if (p.id === 'end') {
    let ok = 0, all = 0, r = [0, 0], l = [0, 0];
    SCORED.forEach(pid => Q[pid].forEach((it, i) => { if (it.a === undefined) return; const good = S.first[qid(pid, i)] === true;
      all++; if (good) ok++; const g = pid[0] === 'r' ? r : l; g[1]++; if (good) g[0]++; }));
    const pct = all ? ok / all : 0;
    view.appendChild(h('p', 'kicker', 'Finish'));
    view.appendChild(h('h2', null, 'Well done!'));
    view.appendChild(h('p', 'lead', 'One last question – then take a screenshot of this page.'));
    view.appendChild(quiz('vote', false));
    const res = h('div', 'result');
    res.innerHTML = `<div class="small">Right the first time</div><div class="big">${ok} / ${all}</div>
      <div class="rows"><div><b>${r[0]} / ${r[1]}</b>Reading</div><div><b>${l[0]} / ${l[1]}</b>Listening</div></div>
      <p style="margin:10px 0 0;font-size:15px">${pct >= .8 ? 'Great job!' : pct >= .5 ? 'Good work!' : 'Nice try!'} Send this screenshot to your teacher. Don’t forget your voice message!</p>`;
    view.appendChild(res);
    const pl2 = playerUI('may', 'May', IMG.may, 'voice message');
    view.appendChild(pl2);
    scriptUI(pl2, 'Read May’s message and listen one more time.');
    const again = h('button', 'again', 'Start again'); again.type = 'button';
    again.addEventListener('click', () => { if (confirm('Start the homework again? Your answers will be deleted.')) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } });
    view.appendChild(again);
  }
  updateNav();
  window.scrollTo(0, 0);
}

function updateNav() {
  const p = PAGES[S.page], done = pageDone(p);
  backBtn.style.visibility = S.page === 0 ? 'hidden' : 'visible';
  nextBtn.style.display = S.page === PAGES.length - 1 ? 'none' : '';
  nextBtn.textContent = S.page === 0 ? 'Start' : 'Next';
  nextBtn.disabled = !done;
  hint.textContent = done ? '' : (p.id === 'speak' ? 'Choose one option in each line.' : 'Fix all the mistakes to go on.');
}
nextBtn.addEventListener('click', () => { if (pageDone(PAGES[S.page]) && S.page < PAGES.length - 1) { S.page++; save(); render(); } });
backBtn.addEventListener('click', () => { if (S.page > 0) { S.page--; save(); render(); } });
render();
</script>
