<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Lab Verbs 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#E8F0F6; --surface:#FFFFFF; --surface2:#F3F7FA; --ink:#1B2B3A; --muted:#55687A; --line:#C7D5E1;
  --steel:#2E5476; --steel-d:#1E3B55; --orange:#F2862B; --orange-d:#C9631A; --green:#4FAE3B; --green-d:#38862A;
  --yellow:#FFCF33; --red:#E0483E; --good-bg:#E2F4DB; --bad-bg:#FBE2DF; --chip:#FFFFFF; --chip-ink:#1B2B3A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121E29; --surface:#1C2C3B; --surface2:#233647; --ink:#EAF1F7; --muted:#A4B6C7; --line:#34495D;
    --steel:#4C7DA8; --steel-d:#2E5476; --good-bg:#1E3A22; --bad-bg:#45211E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E29; --surface:#1C2C3B; --surface2:#233647; --ink:#EAF1F7; --muted:#A4B6C7; --line:#34495D;
  --steel:#4C7DA8; --steel-d:#2E5476; --good-bg:#1E3A22; --bad-bg:#45211E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Bungee","Arial Black","Segoe UI",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:.95rem}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--steel);color:#fff;box-shadow:0 4px 0 var(--steel-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--steel-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.small{padding:7px 13px;font-size:.92rem}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.screen[hidden]{display:none!important}

/* hub */
.hero{display:flex;align-items:center;gap:18px;background:var(--steel);color:#fff;border-radius:22px;padding:14px 20px;position:relative;overflow:hidden}
.hero img{width:120px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.hero p{margin:.3rem 0 0;opacity:.9}
.hero .cast{display:flex;gap:4px;margin-left:auto;align-items:flex-end}
.hero .cast img{width:64px}
.settings{display:flex;flex-wrap:wrap;gap:12px 26px;margin:16px 2px;align-items:center}
.settings .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings .lbl{font-weight:800;color:var(--muted);font-size:.92rem}
.seg{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 11px;font-weight:800;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px 16px;box-shadow:0 5px 0 var(--line);position:relative;min-height:190px;overflow:hidden}
.tile:hover{border-color:var(--orange)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile .ti{font-size:2rem;line-height:1}
.tile h2{font-size:1.02rem}
.tile p{margin:0;color:var(--muted);font-size:.92rem;max-width:62%}
.tile img{position:absolute;right:-6px;bottom:-4px;height:130px;width:auto;pointer-events:none}
.tile .num{position:absolute;top:12px;right:14px;font-family:"Bungee",sans-serif;color:var(--line);font-size:1.1rem}
.listbtn{margin-top:16px}

/* game chrome */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h1{font-size:1.1rem;flex:1}
.hud{font-weight:900;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:5px 12px;white-space:nowrap}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;margin-bottom:12px}
.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.emo{font-size:2.2rem;line-height:1}
.base{font-family:"Bungee",sans-serif;font-size:1.6rem}
.ask{margin-left:auto;font-weight:900;color:var(--orange-d);font-size:1.15rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ask{color:var(--orange)}}
:root[data-theme="dark"] .ask{color:var(--orange)}
.tr{border:2px dashed var(--line);background:transparent;border-radius:10px;padding:3px 10px;font-weight:800;font-size:.88rem;color:var(--muted)}
.tr.on{border-style:solid;border-color:var(--green);color:var(--ink);background:var(--good-bg);font-size:1rem}
.say{display:flex;align-items:center;gap:10px;min-height:62px;margin-top:10px}
.say img{width:54px;height:54px;object-fit:contain;flex:none}
.say p{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700;position:relative}
.say p:empty{display:none}
.say.good p{background:var(--good-bg);border-color:var(--green)}
.say.bad p{background:var(--bad-bg);border-color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.good{background:var(--good-bg);border-color:var(--green)}
.opt.bad{background:var(--bad-bg);border-color:var(--red);opacity:.75}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:20px 22px;max-width:440px;width:100%;text-align:center;border:3px solid var(--line)}
.card img{height:120px}
.card h2{margin:6px 0}
.card .res{font-weight:800;font-size:1.1rem;margin:0 0 12px}
.brk{background:var(--good-bg);border:2px dashed var(--green);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.brk b{display:block;font-family:"Bungee",sans-serif;font-weight:400;font-size:.85rem;color:var(--green-d);margin-bottom:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brk b{color:#8DDC79}}
:root[data-theme="dark"] .brk b{color:#8DDC79}
.brk span{font-size:1.15rem;font-weight:800}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* verb list */
.vtab{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.vtab table{border-collapse:collapse;width:100%;min-width:520px}
.vtab th,.vtab td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line)}
.vtab th{font-family:"Bungee",sans-serif;font-weight:400;font-size:.85rem;color:var(--muted)}
.vtab td:first-child{font-size:1.4rem;width:44px}
.vtab .ru{color:var(--muted)}
.vtab.hideru .ru span{visibility:hidden}
.vtab tr.sep td{border-top:3px solid var(--line)}
@media (prefers-reduced-motion:reduce){.tile,.btn,.opt{transition:none}}
@media (max-width:600px){.hero .cast{display:none}.hero img{width:84px}.base{font-size:1.3rem}.tile p{max-width:70%}}
/* balloon */
.sky{position:relative;height:min(58vh,460px);min-height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(#8FD0F2,#D9F1FB 75%,#BFE6C4);border:2px solid var(--line)}
.balloon{position:absolute;top:0;left:0;width:118px;will-change:transform}
.bal{width:118px;height:136px;border:0;border-radius:50% 50% 48% 48% / 56% 56% 44% 44%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 12%,transparent 13%),var(--c);color:#1B2B3A;font-weight:900;font-size:1.15rem;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);position:relative}
.bal span{background:rgba(255,255,255,.88);border-radius:10px;padding:2px 8px;line-height:1.2}
.bal::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--c);border-bottom:0}
.balloon i{display:block;width:2px;height:60px;margin:6px auto 0;background:rgba(40,60,80,.45)}
.balloon.popped .bal{animation:pop .35s forwards;pointer-events:none}
.balloon.popped i{opacity:0}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.balloon.glow .bal{outline:5px solid var(--yellow);outline-offset:3px}
/* builder */
.build{display:grid;grid-template-columns:minmax(240px,1fr) 1.2fr;gap:18px;align-items:start}
.mach{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;aspect-ratio:1/1.05;overflow:hidden}
.mach>img{width:100%;height:100%;object-fit:contain;transition:transform 1.6s}
.tiles12{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:3px}
.tiles12 div{background:#5C6B78;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;transition:opacity .5s,transform .5s}
.tiles12 div.open{opacity:0;transform:scale(.6)}
.mach.spin>img{animation:spin 1.6s ease-in}
@keyframes spin{0%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(10deg) scale(1.05)}100%{transform:rotate(720deg) scale(.1);opacity:0}}
.scene{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;animation:fadein .6s}
.scene img{width:100%;border-radius:14px}
.scene p{margin:0;font-weight:900;font-size:1.1rem;text-align:center}
@keyframes fadein{from{opacity:0}}
.scene[hidden]{display:none}
@media (max-width:700px){.build{grid-template-columns:1fr}.mach{max-width:320px;margin:0 auto;width:100%}}
/* jump */
.track{position:relative;height:280px;margin-top:12px;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#9BD6F4,#E1F4FB)}
.track .ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(90deg,#6FB64F 0 40px,#5FA544 40px 80px);border-top:5px solid #4E8E37;animation:ground 1s linear infinite}
.track.paused .ground{animation-play-state:paused}
@keyframes ground{to{background-position:-80px 0}}
#g3duo{position:absolute;left:8%;bottom:40px;width:120px;--jd:.9s}
#g3duo.jump{animation:jump var(--jd) ease-in-out}
#g3duo.bump{animation:bump .5s}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-150px) rotate(-8deg)}}
@keyframes bump{25%{transform:translateX(-14px) rotate(-6deg)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.ob{position:absolute;left:0;bottom:44px;font-size:3.4rem;line-height:1;will-change:transform}
.ob.hit{animation:fly .7s forwards}
@keyframes fly{to{margin-bottom:180px;opacity:0;rotate:200deg}}
.hearts{letter-spacing:2px}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:900px}
.mc{aspect-ratio:4/3;border:0;padding:0;background:transparent;position:relative}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .k{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900}
.mc .k{background:repeating-linear-gradient(45deg,var(--steel) 0 12px,var(--steel-d) 12px 24px);color:#fff;font-family:"Bungee",sans-serif;font-size:2rem;box-shadow:0 4px 0 var(--steel-d)}
.mc .f{background:var(--surface);border:3px solid var(--line);transform:rotateY(180deg);font-size:clamp(1rem,2.6vw,1.45rem)}
.mc .f .emo{font-size:clamp(1.6rem,4vw,2.4rem)}
.mc .f small{font-family:"Bungee",sans-serif;font-weight:400;font-size:.7rem;color:var(--orange-d);background:var(--surface2);border-radius:6px;padding:1px 6px}
.mc.done .f{border-color:var(--green);background:var(--good-bg)}
.minfo{margin-top:12px;min-height:66px}
.muted{color:var(--muted);font-weight:700}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="wrap">
<section class="screen" id="hub">
  <div class="hero"><img data-img="machine" alt="The Time Machine"><div><h1>Time Lab Verbs 1</h1><p>Help Duo and the Time Lab team with irregular verbs!</p></div>
    <div class="cast"><img data-img="felix" alt="Felix"><img data-img="lily" alt="Lily"><img data-img="gizmo" alt="Gizmo"><img data-img="duo" alt="Duo"></div></div>
  <div class="settings" id="settings"></div>
  <div class="tiles"><button class="tile" type="button" data-go="g1"><span class="num">1</span><span class="ti">🎈</span><h2>Balloon Pop</h2><p>Pop the balloon with the right form.</p><img data-img="lily" alt=""></button><button class="tile" type="button" data-go="g2"><span class="num">2</span><span class="ti">🔧</span><h2>Fix the Time Machine</h2><p>Right answers fix the Machine.</p><img data-img="felix" alt=""></button><button class="tile" type="button" data-go="g3"><span class="num">3</span><span class="ti">🐶</span><h2>Duo’s Jump</h2><p>Answer fast so Duo can jump.</p><img data-img="duo" alt=""></button><button class="tile" type="button" data-go="g4"><span class="num">4</span><span class="ti">🃏</span><h2>Memory Cards</h2><p>Match each verb with its form.</p><img data-img="gizmo" alt=""></button></div>
  <button class="btn ghost listbtn" data-go="list">📋 All 40 verbs</button>
</section>
<section class="screen" id="list" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Irregular verbs</h1><button class="btn small" id="rutoggle">Show translations</button></div>
  <div class="vtab hideru" id="vlist"></div>
</section>
<section class="screen" id="g1" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Balloon Pop</h1><span class="hud" id="g1hud"></span></div>
  <div class="prompt" id="g1p"></div>
  <div class="sky" id="g1sky"></div>
  <div class="say" id="g1say"><img data-img="lily" alt=""><p></p></div>
</section>

<section class="screen" id="g2" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Fix the Time Machine</h1><span class="hud" id="g2hud"></span></div>
  <div class="build">
    <div class="mach" id="g2mach"><img data-img="machine" alt="The Time Machine" id="g2img"><div class="tiles12" id="g2tiles"></div>
      <div class="scene" id="g2scene" hidden><img id="g2sceneimg" alt=""><p id="g2scenecap"></p></div></div>
    <div>
      <div class="prompt" id="g2p"></div>
      <div class="opts" id="g2opts"></div>
      <div class="say" id="g2say"><img data-img="gizmo" alt=""><p></p></div>
    </div>
  </div>
</section>

<section class="screen" id="g3" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Duo’s Jump</h1><span class="hud" id="g3hud"></span><button class="btn small" id="g3pause">Pause</button></div>
  <div class="prompt" id="g3p"></div>
  <div class="opts" id="g3opts"></div>
  <div class="track" id="g3track"><div class="ground"></div><img data-img="duo" alt="Duo" id="g3duo"><div class="ob" id="g3ob"></div></div>
  <div class="say" id="g3say"><img data-img="felix" alt=""><p></p></div>
</section>

<section class="screen" id="g4" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Memory Cards</h1><span class="hud" id="g4hud"></span></div>
  <div class="mgrid" id="g4grid"></div>
  <div class="prompt minfo" id="g4info"><span class="muted">Flip two cards. Find the verb and its form.</span></div>
</section>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return S.set==='a'?VERBS.slice(0,20):S.set==='b'?VERBS.slice(20):VERBS.slice()}
function deck(){let d=[];return()=>{if(!d.length)d=shuffle(pool());return d.pop()}}
function pickForm(){return S.mode==='mix'?(Math.random()<.5?'v2':'v3'):S.mode}
function regular(b){if(b.endsWith('e'))return b+'d';if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ied';return b+'ed'}
function wrongs(v,f,n){
  const bad=new Set([v[f],...v[f].split(' / ')]);
  const other=f==='v2'?v.v3:v.v2;
  let c=[regular(v.b),v.b];if(S.mode!=='v2')c.push(other);
  if(v.b==='be')c.push('beed','is','are');
  c.push(regular(v.v2.split(' / ')[0]));
  c=shuffle(c.slice(0,3)).concat(c.slice(3));
  const out=[];
  for(const x of c){if(out.length>=n)break;if(!bad.has(x)&&!out.includes(x))out.push(x)}
  let guard=0;
  while(out.length<n&&guard++<200){const w=pick(VERBS)[f];if(!bad.has(w)&&!out.includes(w))out.push(w)}
  return out;
}
function accepts(v,f,t){
  t=t.toLowerCase().replace(/\s+/g,' ').trim();
  const parts=v[f].split(' / ');
  return parts.includes(t)||t.replace(/\s/g,'')===parts.join('/');
}
function modeForms(){return S.mode==='v2'?['v1','v2']:S.mode==='v3'?['v1','v3']:['v1','v2','v3']}
function formsLine(v){return (S.mode==='v2'?['v1','v2']:['v1','v2','v3']).map(k=>k==='v1'?v.b:v[k]).join(' – ')}
function trBtn(v){return `<button class="tr" type="button" data-ru="${v.ru}">Translate</button>`}
function promptHTML(v,f,askText){
  return `<div class="pv"><span class="emo" aria-hidden="true">${v.e}</span><span class="base">${v.b}</span>${trBtn(v)}</div>`+
    (f?`<div class="ask">${askText||FORMNAME[f]+'?'}</div>`:'');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.tr');if(!b)return;
  e.stopPropagation();
  if(b.classList.toggle('on'))b.textContent=b.dataset.ru;else b.textContent='Translate';
},true);

/* sound */
let AC;
function tone(fr,d,type='sine',t0=0,vol=.13){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr;const t=AC.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok(){tone(660,.12,'triangle');tone(990,.2,'triangle',.1)},bad(){tone(190,.28,'sawtooth',0,.06)},pop(){tone(1100,.07,'square',0,.05)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.12))}};
const PRAISE=['Great!','Super!','Yes!','Well done!','Brilliant!','Cool!','Correct!','Nice one!'];

/* say bubble */
function say(id,html,kind){const el=$(id);el.className='say'+(kind?' '+kind:'');$('p',el).innerHTML=html||''}

/* screens */
const GAMES={};let current=null;
function show(id){
  if(current&&GAMES[current]&&GAMES[current].stop)GAMES[current].stop();
  $$('.screen').forEach(s=>s.hidden=s.id!==id);
  $('#over').hidden=true;
  current=id;window.scrollTo(0,0);
  if(GAMES[id])GAMES[id].start();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();show(g.dataset.go)}});

/* finish + movement break */
const BREAKS=['Jump 5 times like Duo! 🐶','Do 5 star jumps! ⭐','Touch your toes 5 times! 🦶','Run on the spot for 10 seconds! 🏃','Swim with your arms for 10 seconds! 🏊','Stretch up high and count to 5! 🙌','Spin around 3 times like the Time Machine! 🌀','Hop on one leg 5 times! 🦵','Clap 10 times as fast as you can! 👏','Jump forward, then jump back, 5 times! ↔️'];
let lastBreak=-1;
function finish({title,text,img='duo',again}){
  let i;do{i=rnd(BREAKS.length)}while(i===lastBreak);lastBreak=i;
  const o=$('#over');
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><img src="${IMG[img]}" alt=""><h2>${title}</h2><p class="res">${text}</p><div class="brk"><b>Duo break</b><span>${BREAKS[i]}</span></div><div class="row"><button class="btn orange" id="again">Play again</button><button class="btn ghost" data-go="hub">Menu</button></div></div>`;
  o.hidden=false;sfx.win();
  $('#again').onclick=()=>{o.hidden=true;again()};
}

/* hub settings + verb list */
function segHTML(key,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${S[key]===v}">${l}</button>`).join('')}</div>`}
function renderSettings(){
  $('#settings').innerHTML=
   `<div class="grp"><span class="lbl">Practise</span>${segHTML('mode',[['v2','V2 past simple'],['v3','V3 participle'],['mix','Both']])}</div>`+
   `<div class="grp"><span class="lbl">Verbs</span>${segHTML('set',[['a','1–20'],['b','21–40'],['all','All 40']])}</div>`+
   `<div class="grp"><span class="lbl">Sound</span>${segHTML('sound',[[true,'On'],[false,'Off']])}</div>`;
  $$('#settings .seg button').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S[b.dataset.k]=v;store.set(b.dataset.k,v);renderSettings()});
}
function renderList(){
  $('#vlist').innerHTML=`<table><thead><tr><th></th><th>V1</th><th>V2</th><th>V3</th><th>Russian</th></tr></thead><tbody>${VERBS.map((v,i)=>`<tr${i===20?' class="sep"':''}><td>${v.e}</td><td><b>${v.b}</b></td><td>${v.v2}</td><td>${v.v3}</td><td class="ru"><span>${v.ru}</span></td></tr>`).join('')}</tbody></table>`;
  $('#rutoggle').onclick=()=>{const t=$('#vlist');t.classList.toggle('hideru');$('#rutoggle').textContent=t.classList.contains('hideru')?'Show translations':'Hide translations'};
}
function initCore(){
  $$('img[data-img]').forEach(i=>i.src=IMG[i.dataset.img]);
  renderSettings();renderList();
}
/* ===== 1 Balloon Pop ===== */
GAMES.g1=(()=>{
  const COLORS=['#F7A04B','#7CCB62','#6FB2EC','#F2766D','#B48BEB','#FFD95A'];
  const ROUNDS=10;let raf,timer,next,round,score,balloons,busy,v,f;
  const sky=()=>$('#g1sky');
  function hud(){$('#g1hud').textContent=`⭐ ${score} / ${ROUNDS}`}
  function stop(){cancelAnimationFrame(raf);clearTimeout(timer)}
  function start(){next=deck();round=0;score=0;hud();newRound()}
  function newRound(){
    stop();if(round>=ROUNDS)return finish({title:'Balloon Pop done!',text:`You got ${score} out of ${ROUNDS}.`,img:'lily',again:start});
    round++;v=next();f=pickForm();const c=v[f];
    $('#g1p').innerHTML=promptHTML(v,f);say('#g1say',`Pop the <b>${FORMNAME[f]}</b> of <b>${v.b}</b>!`);busy=false;
    const el=sky();el.innerHTML='';const H=el.clientHeight;const lanes=shuffle([0,1,2,3]);const cols=shuffle(COLORS);
    const opts=shuffle([c,...wrongs(v,f,3)]);
    balloons=opts.map((t,i)=>{
      const d=document.createElement('div');d.className='balloon';d.style.setProperty('--c',cols[i]);
      d.style.left=`calc(${lanes[i]*25+12.5}% - 59px)`;
      d.innerHTML=`<button class="bal" type="button"><span>${t}</span></button><i></i>`;el.append(d);
      const b={d,t,ok:t===c,y:H+10+rnd(140),sp:(H+220)/(8+Math.random()*3),done:false};
      d.querySelector('.bal').onclick=()=>hit(b);return b;
    });
    let last=performance.now();
    const tick=now=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;
      for(const b of balloons){b.y-=b.sp*dt*(busy?1.8:1);b.d.style.transform=`translateY(${b.y}px)`;
        if(!b.done&&b.y<-210){b.done=true;if(b.ok&&!busy){busy=true;sfx.bad();say('#g1say',`It flew away! It’s <b>${c}</b>.`,'bad');timer=setTimeout(newRound,2000)}}}
      raf=requestAnimationFrame(tick);
    };raf=requestAnimationFrame(tick);
  }
  function hit(b){
    if(busy||b.done)return;b.done=true;busy=true;b.d.classList.add('popped');
    if(b.ok){sfx.pop();sfx.ok();score++;hud();say('#g1say',`${pick(PRAISE)} ${v.b} → <b>${b.t}</b>`,'good');timer=setTimeout(newRound,1200)}
    else{sfx.bad();const g=balloons.find(x=>x.ok);g.d.classList.add('glow');say('#g1say',`Not <b>${b.t}</b>. It’s <b>${v[f]}</b>.`,'bad');timer=setTimeout(newRound,2200)}
  }
  return{start,stop};
})();

/* ===== 2 Fix the Time Machine ===== */
GAMES.g2=(()=>{
  const PARTS=12;const SCENES=[['castle','the Knights’ Castle'],['egypt','Ancient Egypt'],['tomb','the Pharaoh’s tomb'],['future','the Future City']];
  let sceneI=0,next,v,f,fixed,good,firstTry,locked,timer;
  const icons=['🔩','⚙️','🔧','🔋','💡','🧲'];
  function hud(){$('#g2hud').textContent=`🔧 ${fixed} / ${PARTS}`}
  function stop(){clearTimeout(timer)}
  function start(){
    next=deck();fixed=0;good=0;hud();$('#g2scene').hidden=true;$('#g2mach').classList.remove('spin');
    $('#g2tiles').innerHTML=Array.from({length:PARTS},()=>`<div>${pick(icons)}</div>`).join('');q();
  }
  function q(){
    locked=false;firstTry=true;v=next();f=pickForm();
    $('#g2p').innerHTML=promptHTML(v,f);
    $('#g2opts').innerHTML=shuffle([v[f],...wrongs(v,f,2)]).map(t=>`<button class="opt" type="button">${t}</button>`).join('');
    $$('#g2opts .opt').forEach(b=>b.onclick=()=>answer(b));
    if(fixed===0)say('#g2say','The Machine is broken! Every right answer fixes one part.');
  }
  function answer(btn){
    if(locked||btn.disabled)return;const t=btn.textContent;
    if(t===v[f]){
      locked=true;btn.classList.add('good');sfx.ok();if(firstTry)good++;fixed++;hud();
      const closed=$$('#g2tiles div:not(.open)');pick(closed).classList.add('open');
      say('#g2say',`${pick(PRAISE)} <b>${v.b} → ${t}</b>. Part ${fixed} fixed!`,'good');
      timer=fixed>=PARTS?setTimeout(launch,900):setTimeout(q,1200);
    }else{firstTry=false;btn.classList.add('bad');btn.disabled=true;sfx.bad();say('#g2say',`Oops! Not <b>${t}</b>. Try again!`,'bad')}
  }
  function launch(){
    const s=SCENES[sceneI++%SCENES.length];$('#g2mach').classList.add('spin');sfx.win();
    say('#g2say','The Machine works! Hold on, everyone!','good');
    timer=setTimeout(()=>{$('#g2sceneimg').src=IMG[s[0]];$('#g2scenecap').textContent=`Next stop: ${s[1]}!`;$('#g2scene').hidden=false;
      timer=setTimeout(()=>finish({title:'Machine fixed!',text:`${good} of ${PARTS} answers were right the first time.`,img:'felix',again:start}),2600)},1500);
  }
  return{start,stop};
})();

/* ===== 3 Duo's Jump ===== */
GAMES.g3=(()=>{
  const TOTAL=12,OBS=['🪨','📦','🌵','🧱','🪵','🛢️'];
  let raf,next,v,f,state,phase,obx,travel,count,hearts,cleared,paused,gap,last;
  const tr=()=>$('#g3track'),duo=()=>$('#g3duo'),ob=()=>$('#g3ob');
  function hud(){$('#g3hud').innerHTML=`<span class="hearts">${'❤️'.repeat(hearts)}${'🤍'.repeat(3-hearts)}</span> ${Math.min(count,TOTAL)}/${TOTAL}`}
  function stop(){cancelAnimationFrame(raf);paused=false;tr().classList.remove('paused')}
  function start(){next=deck();count=0;hearts=3;cleared=0;travel=7;paused=false;$('#g3pause').textContent='Pause';spawn();last=performance.now();raf=requestAnimationFrame(tick)}
  function spawn(){
    if(count>=TOTAL||hearts<=0){phase='end';return end()}
    count++;v=next();f=pickForm();state='wait';phase='run';
    $('#g3p').innerHTML=promptHTML(v,f);
    $('#g3opts').innerHTML=shuffle([v[f],...wrongs(v,f,2)]).map(t=>`<button class="opt" type="button">${t}</button>`).join('');
    $$('#g3opts .opt').forEach(b=>b.onclick=()=>answer(b));
    const o=ob();o.classList.remove('hit');o.textContent=pick(OBS);obx=tr().clientWidth+10;o.style.transform=`translateX(${obx}px)`;
    say('#g3say','Choose the right answer, and Duo jumps!');hud();
  }
  function answer(btn){
    if(state!=='wait'||phase!=='run')return;const t=btn.textContent;
    $$('#g3opts .opt').forEach(b=>{b.disabled=true;if(b.textContent===v[f])b.classList.add('good')});
    if(t===v[f]){state='ok';sfx.ok();say('#g3say',`${pick(PRAISE)} Get ready to jump!`,'good')}
    else{state='bad';btn.classList.add('bad');sfx.bad();say('#g3say',`Oh no! It’s <b>${v[f]}</b>, not ${t}.`,'bad')}
  }
  function tick(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!paused&&phase!=='end'){
      const W=tr().clientWidth,sp=W/travel,d=duo();obx-=sp*dt;ob().style.transform=`translateX(${obx}px)`;
      const duoR=d.offsetLeft+d.offsetWidth*.78;
      if(phase==='run'&&state==='ok'&&obx<=duoR+sp*.18){
        const jd=Math.min(1.7,Math.max(.6,(d.offsetWidth+90)/sp));d.style.setProperty('--jd',jd+'s');
        d.classList.remove('jump','bump');void d.offsetWidth;d.classList.add('jump');phase='pass';cleared++;travel=Math.max(4.3,travel-.25);
      }else if(phase==='run'&&obx<=duoR){
        if(state==='wait')say('#g3say',`Too slow! It’s <b>${v[f]}</b>.`,'bad');
        $$('#g3opts .opt').forEach(b=>{b.disabled=true;if(b.textContent===v[f])b.classList.add('good')});
        hearts--;hud();sfx.bad();d.classList.remove('bump','jump');void d.offsetWidth;d.classList.add('bump');ob().classList.add('hit');phase='gap';gap=1.6;
      }
      if(phase==='pass'&&obx<-90){phase='gap';gap=.7}
      if(phase==='gap'){gap-=dt;if(gap<=0)spawn()}
    }
    raf=requestAnimationFrame(tick);
  }
  function end(){cancelAnimationFrame(raf);
    finish(hearts>0?{title:'Duo made it!',text:`Duo jumped over ${cleared} of ${TOTAL} obstacles.`,again:start}:{title:'Duo needs a rest!',text:`Duo jumped over ${cleared} obstacles. Try again!`,again:start})}
  $('#g3pause').onclick=()=>{paused=!paused;tr().classList.toggle('paused',paused);$('#g3pause').textContent=paused?'Go!':'Pause'};
  return{start,stop};
})();

/* ===== 4 Memory Cards ===== */
GAMES.g4=(()=>{
  const PAIRS=6;let open,lock,moves,found,timer;
  function hud(){$('#g4hud').textContent=`Moves: ${moves}  ✔ ${found}/${PAIRS}`}
  function stop(){clearTimeout(timer)}
  function start(){
    open=[];lock=false;moves=0;found=0;hud();
    const vs=shuffle(pool()).slice(0,PAIRS);const cards=[];
    vs.forEach((v,i)=>{const f=pickForm();
      cards.push({id:i,v,html:`<span class="emo">${v.e}</span>${v.b}`,base:true});
      cards.push({id:i,v,html:`${v[f]}<small>${f.toUpperCase()}</small>`,base:false});});
    const g=$('#g4grid');g.innerHTML='';
    shuffle(cards).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='mc';b.setAttribute('aria-label','card');
      b.innerHTML=`<div class="in"><div class="k">?</div><div class="f">${c.html}</div></div>`;b.onclick=()=>flip(b,c);g.append(b)});
    $('#g4info').innerHTML='<span class="muted">Flip two cards. Match each verb with its form.</span>';
  }
  function flip(b,c){
    if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
    b.classList.add('up');sfx.pop();open.push([b,c]);
    if(c.base)$('#g4info').innerHTML=promptHTML(c.v);
    if(open.length<2)return;
    moves++;const[[b1,c1],[b2,c2]]=open;open=[];
    if(c1.id===c2.id&&c1.base!==c2.base){
      b1.classList.add('done');b2.classList.add('done');found++;sfx.ok();
      $('#g4info').innerHTML=`<div class="pv"><span class="emo">${c1.v.e}</span><span class="base">${formsLine(c1.v)}</span>${trBtn(c1.v)}</div>`;
      if(found===PAIRS)timer=setTimeout(()=>finish({title:'All pairs found!',text:`You did it in ${moves} moves.`,img:'gizmo',again:start}),900);
    }else{lock=true;timer=setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false},1100)}
    hud();
  }
  return{start,stop};
})();

initCore();</script></body></html>
