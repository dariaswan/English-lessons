<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost in Time — Time Lab game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f2fb; --panel:#ffffff; --ink:#1b1f3b; --soft:#4a5273;
  --green:#4caf2f; --orange:#f28c1e; --teal:#1fa7b8; --red:#e2483d; --gold:#f7c21b;
  --chip:#f2f7fc;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121633; --panel:#1f2548; --ink:#eef1ff; --soft:#b6bce0; --chip:#2a3160;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{ --bg:#121633; --panel:#1f2548; --ink:#eef1ff; --soft:#b6bce0; --chip:#2a3160; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;min-height:100vh}
h1,h2,h3{font-family:"Fredoka","Nunito",system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
.wrap{max-width:920px;margin:0 auto;padding:12px 16px 32px}
/* top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.power{flex:1;min-width:220px;display:flex;align-items:center;gap:10px}
.power img{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--ink);object-fit:cover}
.gauge{flex:1;height:22px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);overflow:hidden;position:relative}
.gauge i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--teal) 0 12px,#38c3d3 12px 24px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.stars{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.15rem;white-space:nowrap}
.trail{display:flex;gap:6px}
.trail span{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--chip);overflow:hidden;opacity:.45}
.trail span.done{opacity:1;border-color:var(--green)}
.trail span.now{opacity:1}
.trail img{width:100%;height:100%;object-fit:cover;background:#fff}
/* panels */
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.scene{width:100%;border-radius:12px;border:3px solid var(--ink);display:block;max-height:340px;object-fit:cover}
.pic{width:170px;height:170px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid var(--ink);flex:none}
.row{display:flex;gap:18px;align-items:center}
@media (max-width:620px){.row{flex-direction:column;text-align:center}.pic{width:140px;height:140px}}
.lead{font-size:1.15rem;color:var(--soft);margin:8px 0 0}
.q{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.55rem;margin:10px 0 0}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--orange);text-align:center;color:var(--orange)}
.hint{font-size:1rem;color:var(--soft);margin-top:6px}
.bubble{display:inline-block;background:var(--chip);border:2px solid var(--ink);border-radius:16px;padding:6px 14px;margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.opt,.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.3rem;border:3px solid var(--ink);border-radius:14px;padding:10px 22px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.opt:hover,.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt:focus-visible,.btn:focus-visible,.subj:focus-visible,.card:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.opt.no{background:#fbe3e1;color:#8a1d15;text-decoration:line-through;opacity:.7;cursor:default;animation:shake .35s}
.opt.yes{background:var(--green);color:#fff}
.btn.go{background:var(--orange);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.small{font-size:1rem;padding:7px 14px}
.feedback{margin-top:16px;font-weight:800;font-size:1.15rem;min-height:1.6em}
.feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
.next{margin-top:12px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
/* pronoun machine */
.pm{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:16px}
@media (max-width:620px){.pm{grid-template-columns:1fr}}
.subjs{display:flex;flex-wrap:wrap;gap:10px}
.subj{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;border:3px solid var(--ink);border-radius:12px;padding:8px 16px;background:var(--chip);color:var(--ink);cursor:pointer;min-width:64px}
.subj.on{background:var(--teal);color:#fff}
.pm-machine{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid var(--ink);justify-self:center}
.spin{animation:wobble .5s}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.out{border:3px dashed var(--ink);border-radius:14px;min-height:150px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.out .big{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.4rem;color:var(--orange)}
.out .ex{font-size:1.1rem}
.out .ex b{color:var(--orange)}
.out img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:10px;border:2px solid var(--ink)}
.ptable{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ptable span{background:var(--chip);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:800;opacity:.35}
.ptable span.seen{opacity:1}
/* verb cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}
.card{perspective:600px;height:96px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.45rem;backface-visibility:hidden;box-shadow:3px 3px 0 var(--ink)}
.card .f{background:var(--panel)}
.card .b{background:var(--orange);color:#fff;transform:rotateY(180deg)}
/* speak & move */
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.words span{background:var(--chip);border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:800}
.model{margin-top:12px;color:var(--soft)}
.teacher{margin-top:18px;padding-top:14px;border-top:3px dotted var(--soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.teacher small{width:100%;color:var(--soft);font-weight:700}
.move{text-align:center}
.move .zap{font-size:3rem;line-height:1}
.timer{font-family:"Fredoka",sans-serif;font-weight:700;font-size:4rem;color:var(--orange);margin:6px 0}
.cast{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.cast img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:12px;border:3px solid var(--ink)}
.center{text-align:center}
.stack>*+*{margin-top:14px}
.retell{margin:10px 0 0;padding-left:1.3em;font-size:1.1rem}
.retell li{margin:4px 0}
.retell b{color:var(--orange)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.ghost{background:none;border:0;color:var(--soft);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.line{min-height:64px;border:3px dashed var(--ink);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:48px}
.tile{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;background:var(--chip);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#line .tile{background:var(--panel)}
.dot{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.4rem}
.ru{display:none;margin:8px 0 0;padding:6px 12px;border-left:5px solid #0039a6;background:var(--chip);border-radius:8px;color:var(--soft);font-size:1rem;font-weight:700;text-align:left}
body.ru-on .ru{display:block}
.wrap{padding-bottom:96px}
.rubar{position:fixed;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.rubtn{display:flex;align-items:center;gap:8px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.rubtn[aria-pressed="true"]{background:var(--teal);color:#fff}
.rubtn:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.flag{width:30px;height:20px;border:1.5px solid var(--ink);border-radius:3px;background:linear-gradient(#fff 0 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="power"><img id="pwImg" alt=""><div class="gauge" aria-label="Machine power"><i id="gauge"></i></div><div class="stars">⭐ <span id="starN">0</span></div></div>
    <div class="trail" id="trail"></div>
  </div>
  <main id="app"></main>
</div>
<div class="rubar"><button class="rubtn" id="rubtn" aria-pressed="false" onclick="const on=document.body.classList.toggle('ru-on');this.setAttribute('aria-pressed',on);"><span class="flag" aria-hidden="true"></span>Перевод</button></div>

const R = k => (k && RUT[k]) ? `<p class="ru">${RUT[k]}</p>` : '';
const PRON = [
  {s:"I", o:"me", ex:"Duo says: “Felix, help <b>me</b>!”", img:"duo"},

const MAX = MISSIONS.reduce((n,m)=>n+m.steps.reduce((k,s)=>k+(s.t==="q"?1:s.t==="build"?2:0),0),0);
let stars=0, mi=0, si=0, found=[], tricky=[];
const app=document.getElementById('app');

function setStars(n){stars=n;document.getElementById('starN').textContent=stars;document.getElementById('gauge').style.width=Math.min(100,stars/MAX*100)+'%';}
function drawTrail(){
  const t=document.getElementById('trail');
  t.innerHTML=MISSIONS.map((m,i)=>`<span class="${found.includes(m.who)?'done':i===mi?'now':''}" title="${m.name}"><img src="${IMG[m.who]}" alt="${m.name}"></span>`).join('');
}
function showBar(on){document.getElementById('bar').hidden=!on;}
function go(html){app.innerHTML=html;window.scrollTo(0,0);const f=app.querySelector('button');if(f)f.focus({preventScroll:true});}

/* ---------- screens ---------- */
function home(){
  showBar(false);
  go(`<div class="panel stack center">
    <h1>Lost in Time</h1>
    <div class="cast"><img src="${IMG.felix}" alt="Felix"><img src="${IMG.lily}" alt="Lily"><img src="${IMG.gizmo}" alt="Gizmo"><img src="${IMG.duo}" alt="Duo"></div>
    <p class="lead">Yesterday the Machine sneezed — BOOM! Felix, Lily and Gizmo flew to different times. Only Duo stayed in the Lab.</p>
    <p class="lead"><b>Help Duo find them.</b> Every right answer gives the Machine power ⭐</p>
    <p class="hint">At the end, take a screenshot and send it to your teacher.</p>
    ${R('home')}
    <div><button class="btn go" onclick="pronouns()">Start</button></div>
  </div>`);
}

function pronouns(){
  showBar(false);
  go(`<div class="panel">
    <h2>The Pronoun Machine</h2>
    <p class="lead">Put a word in. What comes out?</p>${R('pm')}
    <div class="pm">
      <div class="subjs">${PRON.map((p,i)=>`<button class="subj" data-i="${i}">${p.s}</button>`).join('')}</div>
      <img class="pm-machine" id="pmM" src="${IMG.machine}" alt="The Machine">
      <div class="out" id="pmOut"><span class="hint">Click a word…</span></div>
    </div>
    <div class="ptable" id="pt">${PRON.map(p=>`<span>${p.s} → ${p.o}</span>`).join('')}</div>
    <div class="mini"><span class="hint">Say each example sentence out loud!</span><button class="btn go" onclick="verbs()">Next: Verb Lab</button></div>
  </div>`);
  app.querySelectorAll('.subj').forEach(b=>b.onclick=()=>{
    const p=PRON[b.dataset.i];
    app.querySelectorAll('.subj').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const m=document.getElementById('pmM');m.classList.remove('spin');void m.offsetWidth;m.classList.add('spin');
    const out=document.getElementById('pmOut');out.innerHTML='<span class="hint">…</span>';
    setTimeout(()=>{out.innerHTML=`<div class="big pop">${p.o}</div><div class="row" style="gap:10px;flex-direction:row;text-align:left"><img src="${IMG[p.img]}" alt=""><div class="ex">${p.ex}${R(p.ex)}</div></div>`;
      document.querySelectorAll('#pt span')[b.dataset.i].classList.add('seen');},450);
  });
}

function verbs(){
  showBar(false);
  go(`<div class="panel">
    <h2>Verb Lab</h2>
    <p class="lead">Say the past form first — then click to check!</p>${R('verbs')}
    <div class="cards">${VERBS.map(v=>`<button class="card" aria-label="${v[0]}"><div class="in"><div class="f">${v[0]}</div><div class="b">${v[1]}</div></div></button>`).join('')}</div>
    <p class="hint" style="margin-top:14px">Regular verbs just add -ed: land → landed, chase → chased, stop → stopped.</p>
    <div class="mini"><button class="ghost" onclick="pronouns()">Back</button><button class="btn go" onclick="startMission(0)">Find the team!</button></div>
  </div>`);
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('flip'));
}

function startMission(i){
  mi=i;si=0;const m=MISSIONS[i];
  showBar(true);document.getElementById('pwImg').src=IMG.machine;drawTrail();setStars(stars);
  go(`<div class="panel stack">
    <h2>Mission ${i+1}: ${m.place}</h2>
    <img class="scene" src="${IMG[m.scene]}" alt="${m.place}">
    <p class="lead">${m.intro}</p>${R(m.intro)}
    <div class="row" style="justify-content:space-between"><span>Find <b>${m.name}</b>!</span><button class="btn go" onclick="step()">Go!</button></div>
  </div>`);
}

function step(){
  const m=MISSIONS[mi];
  if(si>=m.steps.length) return foundScreen();
  const s=m.steps[si];
  if(s.t==="q") question(s); else if(s.t==="build") build(s); else move(s);
}
function nextStep(){si++;step();}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function question(s){
  const n=MISSIONS[mi].steps.filter(x=>x.t==="q");const k=n.indexOf(s)+1;
  go(`<div class="panel">
    <div class="row">
      <img class="pic" src="${IMG[s.img]}" alt="">
      <div style="flex:1">
        <div class="hint">Question ${k} of ${n.length}</div>
        ${s.pre?`<p class="lead" style="color:var(--ink)">${s.pre}</p>`:''}
        ${s.say?`<p class="lead">${s.say}</p>`:''}
        <p class="q">${S(s.q)}</p>
        ${s.hint?`<p class="hint">(${s.hint})</p>`:''}
        ${R(s.pre)}${R(s.say)}${R(s.q)}${R('qhow')}
      </div>
    </div>
    <div class="opts">${shuffle(s.o).map(o=>`<button class="opt">${o}</button>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="next" id="nx"></div>
  </div>`);
  let tries=0,done=false;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done||b.classList.contains('no'))return;
    const fb=document.getElementById('fb');
    if(b.textContent===s.a){
      done=true;b.classList.add('yes');
      const q=app.querySelector('.q .blank');if(q){q.textContent=s.a;q.classList.add('pop');}
      if(tries===0){setStars(stars+1);fb.innerHTML='Yes! +1 ⭐ <span class="hint" style="font-weight:700">'+s.tip+'</span>';}
      else fb.innerHTML='That’s it! <span class="hint" style="font-weight:700">'+s.tip+'</span>';
      fb.className='feedback good';
      document.getElementById('nx').innerHTML='<button class="btn green" id="nb">Next</button>';
      document.getElementById('nb').onclick=nextStep;document.getElementById('nb').focus();
    }else{
      if(!tries)tricky.push(s.q.replace('___',s.a).replace(/ ([.!”])/g,'$1'));
      tries++;b.classList.add('no');b.disabled=true;
      fb.className='feedback bad';fb.textContent='Try again! Tip: '+s.tip;
    }
  });
}

function build(s){
  const pool=shuffle(s.w.concat(s.x||[])).map((w,i)=>({w,i}));
  let line=[],tries=0,done=false;
  go(`<div class="panel">
    <div class="row">
      <img class="pic" src="${IMG[s.img]}" alt="">
      <div style="flex:1">
        <h2>Build a sentence</h2>
        <p class="q" style="font-size:1.3rem">${s.q}</p>
        <p class="hint">Click the words in the right order. One word is extra! Then read your sentence out loud.</p>${R(s.q)}${R('bhow')}
      </div>
    </div>
    <div class="line" id="line"></div>
    <div class="tiles" id="tiles"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="next" id="nx"><button class="btn go" id="ck">Check</button></div>
  </div>`);
  function draw(){
    document.getElementById('line').innerHTML=line.length?line.map((t,k)=>`<button class="tile" data-k="${k}">${t.w}</button>`).join('')+'<span class="dot">.</span>':'<span class="hint">Your sentence…</span>';
    document.getElementById('tiles').innerHTML=pool.filter(t=>!line.includes(t)).map(t=>`<button class="tile" data-i="${t.i}">${t.w}</button>`).join('');
    app.querySelectorAll('#line .tile').forEach(b=>b.onclick=()=>{if(done)return;line.splice(+b.dataset.k,1);draw();});
    app.querySelectorAll('#tiles .tile').forEach(b=>b.onclick=()=>{if(done)return;line.push(pool.find(t=>t.i==b.dataset.i));draw();});
  }
  draw();
  document.getElementById('ck').onclick=()=>{
    if(done)return;const fb=document.getElementById('fb');
    if(line.map(t=>t.w).join(' ')===s.w.join(' ')){
      done=true;const p=tries?1:2;setStars(stars+p);
      fb.className='feedback good';fb.textContent='Great sentence! +'+p+' ⭐';
      document.getElementById('nx').innerHTML='<button class="btn green" id="nb">Next</button>';
      document.getElementById('nb').onclick=nextStep;document.getElementById('nb').focus();
    }else{
      if(!tries)tricky.push(s.w.join(' ')+'.');tries++;
      fb.className='feedback bad';fb.textContent='Not yet! '+(s.tip||'Check the order — and find the extra word.');
    }
  };
}

function move(s){
  go(`<div class="panel move">
    <div class="zap">⚡</div><h2>Move break!</h2>
    <p class="q" style="font-size:1.35rem">${s.q}</p>
    ${R(s.q)}${R('mhow')}
    <div class="timer" id="tm">${s.sec}</div>
    <button class="btn go" id="tb">Start</button>
  </div>`);
  const tb=document.getElementById('tb');let left=s.sec,iv=null;
  tb.onclick=()=>{
    if(iv){return;}
    if(left<=0){clearInterval(iv);return nextStep();}
    tb.textContent='Go go go!';
    iv=setInterval(()=>{left--;document.getElementById('tm').textContent=left;
      if(left<=0){clearInterval(iv);iv=null;document.getElementById('tm').textContent='Done!';tb.textContent='Next';}},1000);
  };
}

function foundScreen(){
  const m=MISSIONS[mi];found.push(m.who);drawTrail();
  const last=mi===MISSIONS.length-1;
  go(`<div class="panel center stack">
    <img class="pic pop" style="width:210px;height:210px;margin:0 auto" src="${IMG[m.who]}" alt="${m.name}">
    <h2>You found ${m.name}!</h2>${R('found_'+m.who)}
    <p class="lead">${last?'The whole team is together again!':'Great job, Duo! '+(MISSIONS.length-found.length)+' more to find.'}</p>
    <div><button class="btn go" onclick="${last?'finale()':'startMission('+(mi+1)+')'}">${last?'Go home':'Next mission'}</button></div>
  </div>`);
}

function finale(){
  drawTrail();
  const pct=Math.round(stars/MAX*100);
  go(`<div class="panel stack">
    <h2 class="center">Back in the Lab!</h2>
    <div class="cast"><img src="${IMG.felix}" alt="Felix"><img src="${IMG.lily}" alt="Lily"><img src="${IMG.gizmo}" alt="Gizmo"><img src="${IMG.duo}" alt="Duo"><img src="${IMG.machine}" alt="The Machine"></div>
    <p class="center q" style="font-size:1.5rem">⭐ ${stars} of ${MAX}</p>
    <p class="center lead">${pct>=85?'Super time traveller!':pct>=60?'Great work! Play again to get more stars.':'Good try! Play again — you can do it!'}</p>
    ${tricky.length?`<h3>Tricky ones — read them out loud:</h3><ol class="retell">${tricky.map(t=>`<li>${t}</li>`).join('')}</ol>`:'<h3 class="center">No mistakes at all. Wow!</h3>'}
    <p class="center hint">📸 Take a screenshot of this page and send it to your teacher.</p>${R('fin')}
    <div class="mini" style="justify-content:center"><button class="btn go" onclick="stars=0;found=[];tricky=[];home()">Play again</button></div>
  </div>`);
}
