<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stop Mia!</title>
<style>
:root{--night:#161A29;--night2:#22283C;--night3:#2E3550;--moon:#F4E9C8;--pink:#F08DAA;--pink-d:#C9607C;--blue:#8FAEE6;
  --text:#ECEFF7;--soft:#9AA3BE;--ok:#5CCB92;--bad:#F07F8E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 80% -10%,#2B3150 0%,var(--night) 60%);color:var(--text);
  font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
/* header */
.hud{background:var(--night2);border-radius:20px;padding:12px 14px;margin-bottom:16px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow+.hrow{margin-top:10px}
.av{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--night3)}
.lbl{font-size:12px;color:var(--soft);width:70px;flex:none;line-height:1.2}
.meter{flex:1;height:12px;background:var(--night3);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F5D67A,#FFF1BF);border-radius:6px;transition:width .4s}
.stairs{flex:1;display:flex;gap:3px;align-items:flex-end;height:30px}
.stairs span{flex:1;background:var(--night3);border-radius:3px}
.stairs span.on{background:var(--pink)}
.goal{font-size:22px;flex:none;width:30px;text-align:center}
/* cards */
.card{background:var(--night2);border-radius:22px;padding:20px 18px;flex:1;display:flex;flex-direction:column}
.lv{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);font-weight:600;margin:0 0 4px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:30px;margin:0 0 8px;line-height:1.15}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:22px;margin:0 0 8px}
.story{color:#D5DAE8;margin:0 0 14px}
.story b{color:var(--moon);font-weight:600}
.q{font-size:20px;margin:6px 0 18px;line-height:1.4}
.q .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--pink);margin:0 4px;text-align:center;color:var(--moon)}
.emoji{font-size:64px;text-align:center;margin:4px 0 12px;line-height:1}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--night3);border:2px solid transparent;border-radius:16px;padding:14px 12px;font-size:18px;text-align:center;min-height:56px}
.opt:active{transform:scale(.98)}
.opt.ok{background:rgba(92,203,146,.18);border-color:var(--ok)}
.opt.bad{background:rgba(240,127,142,.18);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.box{display:flex;flex-direction:column;align-items:center;gap:2px}
.box small{font-size:12px;color:var(--soft)}
.built{min-height:58px;background:var(--night);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.built:empty::before{content:"Tap the words in order";color:var(--soft);font-size:14px;padding-left:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--night3);border:0;border-radius:12px;padding:10px 14px;font-size:17px}
.built .tile{background:var(--blue);color:var(--night)}
.tile[disabled]{opacity:.25}
.msg{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px}
.msg .bub{background:#F7E4EA;color:#2C2430;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:18px;line-height:1.7}
.msg.alex .bub{background:#E3E8F3}
.msg small{display:block;font-size:12px;font-weight:600;color:var(--pink-d)}
.msg.alex small{color:#5A77A6}
.w{border:0;background:transparent;padding:1px 3px;border-radius:6px;font-size:18px;color:inherit}
.w.sel{background:#F5D67A}
.w.okw{background:rgba(92,203,146,.35)}
.hint{font-size:14px;color:var(--soft);margin:0 0 10px}
.fb{margin-top:16px;border-radius:14px;padding:12px 14px;font-size:16px;display:none}
.fb.show{display:block}
.fb.good{background:rgba(92,203,146,.15);color:#C9F2DC}
.fb.badf{background:rgba(240,127,142,.15);color:#FFD5DB}
.fb b{color:#fff}
.spacer{flex:1}
.main{margin-top:18px;background:var(--pink);color:#2A1520;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:700;width:100%}
.ghost{margin-top:10px;background:transparent;border:1px solid var(--night3);border-radius:16px;padding:12px;width:100%;color:var(--soft)}
.big{font-size:56px;text-align:center;margin:10px 0}
.stars{font-size:38px;text-align:center;letter-spacing:6px;margin:6px 0 12px}
.noise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-family:Georgia,serif;font-size:44px;color:var(--moon);
  pointer-events:none;opacity:0;transition:opacity .25s,transform .35s;text-shadow:0 4px 24px rgba(0,0,0,.6);white-space:nowrap}
.noise.pop{opacity:1;transform:translate(-50%,-50%) scale(1)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const MAX_STEPS=10;
const LEVELS=[
 {title:'Words',story:'It’s midnight. Mia opens her door very quietly… She wants Lia’s guitar! <b>Answer correctly to make a noise and wake up Dad.</b> Every mistake: Mia takes one step down the stairs.',
  qs:[
  {t:'choice',emoji:'🌪️',q:'Lia’s room is always…',o:['messy','neat','quiet'],a:'messy'},
  {t:'choice',emoji:'👑',q:'Mum always says “Do this! Do that!” She is…',o:['shy','bossy','lazy'],a:'bossy'},
  {t:'choice',emoji:'🤫',q:'Mia doesn’t talk tonight. She is…',o:['loud','funny','quiet'],a:'quiet'},

  {t:'choice',emoji:'🍭',q:'Mum says Mia is the … girl in the world.',o:['sweetest','rudest','loudest'],a:'sweetest'},
  {t:'choice',emoji:'↔️',q:'The opposite of <b>neat</b> is…',o:['kind','messy','shy'],a:'messy'},
  {t:'choice',emoji:'↔️',q:'The opposite of <b>loud</b> is…',o:['quiet','funny','bossy'],a:'quiet'},
  {t:'choice',emoji:'↔️',q:'The opposite of <b>rude</b> is…',o:['lazy','kind','busy'],a:'kind'},
  {t:'choice',emoji:'↔️',q:'The opposite of <b>lazy</b> is…',o:['hardworking','easygoing','sweet'],a:'hardworking'},
 ]},
 {title:'Every day or right now?',story:'Mia is on the stairs now. <b>Is it a habit or is it happening now?</b> Then build sentences — don’t forget <i>is</i> + <i>-ing</i>!',
  qs:[
  {t:'sort',q:'Lia practises the guitar every day.',a:'day'},
  {t:'sort',q:'Mum is looking at the photos.',a:'now'},
  {t:'sort',q:'Mia always says “Yes, Mum.”',a:'day'},
  {t:'sort',q:'Dad is sleeping on the sofa.',a:'now'},
  {t:'sort',q:'Lia writes songs.',a:'day'},
  {t:'sort',q:'Mia is walking down the stairs.',a:'now'},
  {t:'tiles',a:['Lia','is','sleeping','in her room.'],x:['sleep']},
  {t:'tiles',a:['Mia','is','looking','at the guitar.'],x:['look','are']},
  {t:'tiles',a:['Dad','is','dreaming','about pizza.'],x:['dream','am']},
 ]},
 {title:'Bigger, better, best',story:'Mia is in the living room! The guitar is near the sofa. <b>Choose the right form — quick!</b>',
  qs:[
  {t:'choice',q:'Lia’s room is <span class="gap">?</span> than Mia’s.',o:['messier','more messy','messyer'],a:'messier'},
  {t:'choice',q:'Tonight Mia is <span class="gap">?</span> than usual.',o:['more quiet','quieter','quietter'],a:'quieter'},
  {t:'choice',q:'Mum is the <span class="gap">?</span> person in the family.',o:['bossier','most bossy','bossiest'],a:'bossiest'},
  {t:'choice',q:'Lia is <span class="gap">?</span> than Mia.',o:['more honest','honester','most honest'],a:'more honest'},
  {t:'choice',q:'Dad is <span class="gap">?</span> than Mum.',o:['easygoinger','more easygoing','most easygoing'],a:'more easygoing'},
  {t:'choice',q:'Mia thinks she is the <span class="gap">?</span> daughter.',o:['goodest','better','best'],a:'best'},
  {t:'choice',q:'Lia is funnier <span class="gap">?</span> Mia.',o:['then','than','that'],a:'than'},

 ]},

  {t:'fix',who:'May',w:['Mia','are','writing','to','me','right','now.'],bad:1,o:['is','am','be'],a:'is'},

const TOTAL=LEVELS.reduce((s,l)=>s+l.qs.length,0);
const NOISES=['Bang!','Clang!','Squeak!','Thud!','Ding-dong!','Crash!','Beep beep!','Woof!','Creak!','Pop!'];
let L=0,Q=0,steps=0,correct=0,mistakes=0,stepsAtLevel=0,correctAtLevel=0;
const card=document.getElementById('card'),hud=document.getElementById('hud');
const stairs=document.getElementById('stairs');
for(let i=0;i<MAX_STEPS;i++){const s=document.createElement('span');s.style.height=(30-i*2.2)+'px';stairs.appendChild(s);}
function hudUpdate(){document.getElementById('wake').style.width=(correct/TOTAL*100)+'%';
  [...stairs.children].forEach((s,i)=>s.classList.toggle('on',i<steps));}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function noise(){const n=document.getElementById('noise');n.textContent=NOISES[Math.floor(Math.random()*NOISES.length)];
  n.classList.add('pop');setTimeout(()=>n.classList.remove('pop'),650);}

function intro(){hud.hidden=true;card.innerHTML=`<p class="lv">Mia & Lia · a night game</p><h1>Stop Mia!</h1>
<p class="story">Lia is writing a song for Mum. It’s almost ready. But Mia heard Mum and Dad… and she has <b>an idea</b>.</p>
<p class="story">Tonight Lia’s guitar is in the living room. Mia is coming for it. Only <b>Dad</b> can stop her — but he’s asleep!</p>
<p class="story">✅ Right answer: you make a noise, and Dad wakes up a little.<br>❌ Mistake: Mia takes one step closer to the guitar. 10 steps and she has it!</p>
<div class="spacer"></div><button class="main" id="go">Start</button>`;document.getElementById('go').onclick=()=>levelIntro();}

function levelIntro(){hud.hidden=false;hudUpdate();stepsAtLevel=steps;correctAtLevel=correct;Q=0;const lv=LEVELS[L];
  card.innerHTML=`<p class="lv">Level ${L+1} of ${LEVELS.length}</p><h2>${lv.title}</h2><p class="story">${lv.story}</p><div class="spacer"></div><button class="main" id="go">Go!</button>`;
  document.getElementById('go').onclick=()=>show();}

function finish(ok,right,fbText,auto){
  const fb=document.getElementById('fb');
  if(ok){correct++;noise();fb.className='fb show good';fb.innerHTML=fbText||'Yes! Dad moves in his sleep…';}
  else{steps++;mistakes++;card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),400);
    fb.className='fb show badf';fb.innerHTML=`Shh… Mia takes a step. The answer is <b>${right}</b>.`;}
  hudUpdate();
  const next=document.getElementById('next');next.hidden=false;
  if(steps>=MAX_STEPS){next.textContent='Oh no…';next.onclick=lose;return;}
  next.onclick=advance;
  if(ok&&auto){setTimeout(()=>{if(document.getElementById('next')===next)advance();},900);}
}
function advance(){Q++;if(Q>=LEVELS[L].qs.length){L++;if(L>=LEVELS.length)return win();return levelIntro();}show();}
const tail='<div class="fb" id="fb"></div><div class="spacer"></div><button class="main" id="next" hidden>Next</button>';

function show(){
  const q=LEVELS[L].qs[Q],head=`<p class="lv">Level ${L+1} · ${Q+1} / ${LEVELS[L].qs.length}</p>`;
  if(q.t==='choice'){
    card.innerHTML=head+(q.emoji?`<div class="emoji">${q.emoji}</div>`:'')+`<p class="q">${q.q}</p><div class="opts">${shuffle(q.o).map(o=>`<button class="opt">${o}</button>`).join('')}</div>`+tail;
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok');});
      const ok=b.textContent===q.a;if(!ok)b.classList.add('bad');finish(ok,q.a,null,true);});
  }
  if(q.t==='sort'){
    card.innerHTML=head+`<p class="q">“${q.q}”</p><div class="opts two">
      <button class="opt box" data-v="day"><span>🔁</span>every day<small>habit</small></button>
      <button class="opt box" data-v="now"><span>👀</span>right now<small>happening now</small></button></div>`+tail;
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add('ok');});
      const ok=b.dataset.v===q.a;if(!ok)b.classList.add('bad');finish(ok,q.a==='day'?'every day':'right now',null,true);});
  }
  if(q.t==='tiles'){
    card.innerHTML=head+`<p class="hint">Build the sentence. Careful — some words are extra!</p><div class="built" id="built"></div>
      <div class="tiles" id="tiles">${shuffle(q.a.concat(q.x)).map(w=>`<button class="tile">${w}</button>`).join('')}</div>
      <button class="ghost" id="undo">Start again</button>`+tail;
    const built=document.getElementById('built'),picked=[];
    card.querySelectorAll('#tiles .tile').forEach(t=>t.onclick=()=>{if(picked.length>=q.a.length)return;t.disabled=true;picked.push(t.textContent);
      const c=document.createElement('span');c.className='tile';c.textContent=t.textContent;built.appendChild(c);
      if(picked.length===q.a.length){card.querySelectorAll('.tile').forEach(x=>x.disabled=true);document.getElementById('undo').hidden=true;
        const ok=picked.join(' ')===q.a.join(' ');finish(ok,q.a.join(' '),ok?'Yes! <b>'+q.a.join(' ')+'</b>':null,false);}});
    document.getElementById('undo').onclick=()=>{picked.length=0;built.innerHTML='';card.querySelectorAll('#tiles .tile').forEach(x=>x.disabled=false);};

      const wrong=card.querySelector(`.w[data-i="${q.bad}"]`);wrong.classList.add('sel');
      const missed=i!==q.bad;
      document.getElementById('step2').innerHTML=`<p class="hint">${missed?'The wrong word is <b style="color:#fff">'+q.w[q.bad]+'</b>. ':''}Now choose the right word:</p><div class="opts">${shuffle(q.o).map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
      card.querySelectorAll('#step2 .opt').forEach(o=>o.onclick=()=>{card.querySelectorAll('#step2 .opt').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('ok');});
        const ok=o.textContent===q.a&&!missed;if(o.textContent!==q.a)o.classList.add('bad');
        if(o.textContent===q.a){wrong.textContent=q.a;wrong.classList.remove('sel');wrong.classList.add('okw');}
        finish(ok,q.a,null,false);});
    });
  }
}
function lose(){hud.hidden=false;card.innerHTML=`<div class="big">🎸😈</div><h2>Mia has the guitar!</h2>
<p class="story">Oh no… Mia is running upstairs with Lia’s guitar. But wait — it’s only a dream. Try this level again!</p>
<div class="spacer"></div><button class="main" id="again">Try level ${L+1} again</button>`;
  document.getElementById('again').onclick=()=>{steps=stepsAtLevel;correct=correctAtLevel;levelIntro();};}
function win(){hud.hidden=false;hudUpdate();const st=mistakes<=2?3:mistakes<=6?2:1;
  card.innerHTML=`<div class="big">💡</div><p class="lv">You did it!</p><h2>Click! The light is on.</h2>
<p class="story"><b>Dad:</b> Mia? What are you doing in the living room?<br><b>Mia:</b> Erm… I’m… I’m getting a glass of water, Dad!<br><b>Dad:</b> Hmm. With Lia’s guitar?</p>
<div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
<p class="story" style="text-align:center">Right answers: <b>${correct}</b> · Mistakes: <b>${mistakes}</b></p>
<p class="story" style="text-align:center">Is Mia really going to stop? We’ll see next lesson…</p>
<div class="spacer"></div><button class="main" id="again">Play again</button>`;
  document.getElementById('again').onclick=()=>{L=0;Q=0;steps=0;correct=0;mistakes=0;intro();};}
intro();
</script>
