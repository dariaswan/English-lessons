<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Lab Verbs 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#E8F0F6; --surface:#FFFFFF; --surface2:#F3F7FA; --ink:#1B2B3A; --muted:#55687A; --line:#C7D5E1;
  --steel:#2E5476; --steel-d:#1E3B55; --orange:#F2862B; --orange-d:#C9631A; --green:#4FAE3B; --green-d:#38862A;
  --yellow:#FFCF33; --red:#E0483E; --good-bg:#E2F4DB; --bad-bg:#FBE2DF; --chip:#FFFFFF; --chip-ink:#1B2B3A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121E29; --surface:#1C2C3B; --surface2:#233647; --ink:#EAF1F7; --muted:#A4B6C7; --line:#34495D;
    --steel:#4C7DA8; --steel-d:#2E5476; --good-bg:#1E3A22; --bad-bg:#45211E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E29; --surface:#1C2C3B; --surface2:#233647; --ink:#EAF1F7; --muted:#A4B6C7; --line:#34495D;
  --steel:#4C7DA8; --steel-d:#2E5476; --good-bg:#1E3A22; --bad-bg:#45211E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Bungee","Arial Black","Segoe UI",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:.95rem}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--steel);color:#fff;box-shadow:0 4px 0 var(--steel-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--steel-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.small{padding:7px 13px;font-size:.92rem}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.screen[hidden]{display:none!important}

/* hub */
.hero{display:flex;align-items:center;gap:18px;background:var(--steel);color:#fff;border-radius:22px;padding:14px 20px;position:relative;overflow:hidden}
.hero img{width:120px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.hero p{margin:.3rem 0 0;opacity:.9}
.hero .cast{display:flex;gap:4px;margin-left:auto;align-items:flex-end}
.hero .cast img{width:64px}
.settings{display:flex;flex-wrap:wrap;gap:12px 26px;margin:16px 2px;align-items:center}
.settings .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings .lbl{font-weight:800;color:var(--muted);font-size:.92rem}
.seg{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:5px 11px;font-weight:800;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px 16px;box-shadow:0 5px 0 var(--line);position:relative;min-height:190px;overflow:hidden}
.tile:hover{border-color:var(--orange)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile .ti{font-size:2rem;line-height:1}
.tile h2{font-size:1.02rem}
.tile p{margin:0;color:var(--muted);font-size:.92rem;max-width:62%}
.tile img{position:absolute;right:-6px;bottom:-4px;height:130px;width:auto;pointer-events:none}
.tile .num{position:absolute;top:12px;right:14px;font-family:"Bungee",sans-serif;color:var(--line);font-size:1.1rem}
.listbtn{margin-top:16px}

/* game chrome */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h1{font-size:1.1rem;flex:1}
.hud{font-weight:900;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:5px 12px;white-space:nowrap}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;margin-bottom:12px}
.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.emo{font-size:2.2rem;line-height:1}
.base{font-family:"Bungee",sans-serif;font-size:1.6rem}
.ask{margin-left:auto;font-weight:900;color:var(--orange-d);font-size:1.15rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ask{color:var(--orange)}}
:root[data-theme="dark"] .ask{color:var(--orange)}
.tr{border:2px dashed var(--line);background:transparent;border-radius:10px;padding:3px 10px;font-weight:800;font-size:.88rem;color:var(--muted)}
.tr.on{border-style:solid;border-color:var(--green);color:var(--ink);background:var(--good-bg);font-size:1rem}
.say{display:flex;align-items:center;gap:10px;min-height:62px;margin-top:10px}
.say img{width:54px;height:54px;object-fit:contain;flex:none}
.say p{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:700;position:relative}
.say p:empty{display:none}
.say.good p{background:var(--good-bg);border-color:var(--green)}
.say.bad p{background:var(--bad-bg);border-color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.good{background:var(--good-bg);border-color:var(--green)}
.opt.bad{background:var(--bad-bg);border-color:var(--red);opacity:.75}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:20px 22px;max-width:440px;width:100%;text-align:center;border:3px solid var(--line)}
.card img{height:120px}
.card h2{margin:6px 0}
.card .res{font-weight:800;font-size:1.1rem;margin:0 0 12px}
.brk{background:var(--good-bg);border:2px dashed var(--green);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.brk b{display:block;font-family:"Bungee",sans-serif;font-weight:400;font-size:.85rem;color:var(--green-d);margin-bottom:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brk b{color:#8DDC79}}
:root[data-theme="dark"] .brk b{color:#8DDC79}
.brk span{font-size:1.15rem;font-weight:800}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* verb list */
.vtab{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.vtab table{border-collapse:collapse;width:100%;min-width:520px}
.vtab th,.vtab td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line)}
.vtab th{font-family:"Bungee",sans-serif;font-weight:400;font-size:.85rem;color:var(--muted)}
.vtab td:first-child{font-size:1.4rem;width:44px}
.vtab .ru{color:var(--muted)}
.vtab.hideru .ru span{visibility:hidden}
.vtab tr.sep td{border-top:3px solid var(--line)}
@media (prefers-reduced-motion:reduce){.tile,.btn,.opt{transition:none}}
@media (max-width:600px){.hero .cast{display:none}.hero img{width:84px}.base{font-size:1.3rem}.tile p{max-width:70%}}
/* catch */
.field{position:relative;height:min(56vh,440px);min-height:330px;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.9) 0 1.5px,transparent 2px) 0 0/90px 70px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.7) 0 1.5px,transparent 2px) 0 0/130px 110px,linear-gradient(#22305E,#4A3F86 60%,#8A5AA8);touch-action:none;cursor:none}
.catcher{position:absolute;bottom:0;left:0;width:120px;pointer-events:none;will-change:transform}
.catcher img{width:120px;display:block}
.catcher .basket{position:absolute;left:58px;top:61px;width:62px;z-index:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.catcher.oops{animation:shake .4s}
.chip{position:absolute;top:0;left:0;background:var(--chip);color:var(--chip-ink);font-weight:900;font-size:1.15rem;border-radius:14px;padding:6px 14px;border:3px solid #FFCF33;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;will-change:transform;pointer-events:none}
.chip.gone{opacity:0;transition:opacity .3s}
.help{margin:6px 4px 0;color:var(--muted);font-size:.9rem}
/* sort */
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bin{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bins.two{grid-template-columns:repeat(2,1fr)}
.bin[hidden]{display:none}
.bin span{color:var(--muted);font-weight:700;font-size:.9rem}
.bin.hover{border-color:var(--orange);background:var(--surface2)}
.bin.flash{border-color:var(--red)}
.drop{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:100%}
.scards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 6px;min-height:60px}
.scard{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;font-weight:900;font-size:1.15rem;box-shadow:0 4px 0 var(--line);touch-action:none;user-select:none;display:flex;align-items:center;gap:6px}
.scard.sel{border-color:var(--orange);transform:translateY(-4px)}
.scard.dragging{position:relative;z-index:20;pointer-events:none;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.drop .scard{box-shadow:none;border-color:var(--green);background:var(--good-bg);justify-content:center;font-size:1rem;padding:4px 8px;cursor:default}
.trrow{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:8px}
.trrow .pv .base{font-size:1.05rem}.trrow .emo{font-size:1.5rem}
@media (max-width:560px){.bins{gap:6px}.bin{padding:6px}.bin h3{font-size:.85rem}.bins.two{grid-template-columns:repeat(2,1fr)}
.bin[hidden]{display:none}
.bin span{font-size:.75rem;text-align:center}}
/* type */
.typer{display:grid;grid-template-columns:minmax(200px,.8fr) 1.3fr;gap:18px;align-items:start}
.tmach{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 50px 14px 14px}
.tmach img{width:100%;display:block}
.tmach.hot img{animation:shake .35s 3}
.steam{position:absolute;top:6px;left:30%;font-size:2.4rem;opacity:0;transition:opacity .3s}
.tmach.hot .steam{opacity:1}
.thermo{position:absolute;right:14px;top:16px;bottom:16px;width:22px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);overflow:hidden;display:flex;align-items:flex-end}
.thermo div{width:100%;height:0;background:linear-gradient(to top,#4FAE3B,#FFCF33 55%,#E0483E)}
.tbox input{width:100%;font:inherit;font-size:1.8rem;font-weight:900;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.tbox.good input{border-color:var(--green);background:var(--good-bg)}
.tbox.bad input{border-color:var(--red)}
.hintline{font-family:"Bungee",sans-serif;font-size:1.3rem;letter-spacing:.2em;min-height:1.8em;margin:8px 4px;color:var(--muted)}
.row2{display:flex;gap:10px}
@media (max-width:700px){.typer{grid-template-columns:1fr}.tmach{max-width:260px;margin:0 auto}}
/* wheel */
.wheelwrap{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:20px;align-items:center}
.wheelbox{position:relative;max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.wheelbox canvas{pointer-events:none;width:100%;height:auto;aspect-ratio:1;transition:transform 3.8s cubic-bezier(.15,.7,.2,1)}
.pointer{font-size:2.2rem;line-height:1;color:var(--red);margin-bottom:-12px;position:relative;z-index:2}
.spinbtn{position:relative;z-index:3;margin-top:12px;font-size:1.15rem;padding:12px 34px}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-height:260px}
.qcard>img{height:110px}
.qcard .bigq{font-weight:900;font-size:1.2rem;margin:0}
.qcard .forms{font-family:"Bungee",sans-serif;font-size:1.3rem}
.qcard .forms .hl{background:var(--yellow);color:#1B2B3A;border-radius:8px;padding:0 6px}
.qcard .bonus{background:var(--surface2);border-radius:12px;padding:8px 12px;font-weight:700;margin:0}
@media (max-width:760px){.wheelwrap{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<section class="screen" id="hub">
  <div class="hero"><img data-img="machine" alt="The Time Machine"><div><h1>Time Lab Verbs 2</h1><p>More irregular verb games with Duo and the Time Lab team!</p></div>
    <div class="cast"><img data-img="felix" alt="Felix"><img data-img="lily" alt="Lily"><img data-img="gizmo" alt="Gizmo"><img data-img="duo" alt="Duo"></div></div>
  <div class="settings" id="settings"></div>
  <div class="tiles"><button class="tile" type="button" data-go="g5"><span class="num">5</span><span class="ti">🧺</span><h2>Catch It</h2><p>Move Duo and catch the right form.</p><img data-img="duo" alt=""></button><button class="tile" type="button" data-go="g6"><span class="num">6</span><span class="ti">🗂️</span><h2>Sort the Forms</h2><p>Put each card in V1, V2 or V3.</p><img data-img="gizmo" alt=""></button><button class="tile" type="button" data-go="g7"><span class="num">7</span><span class="ti">⌨️</span><h2>Type It Fast</h2><p>Type the answer before the Machine gets hot.</p><img data-img="machine" alt=""></button><button class="tile" type="button" data-go="g8"><span class="num">8</span><span class="ti">🎡</span><h2>Lily’s Quiz Wheel</h2><p>Spin, then say the answer out loud.</p><img data-img="lily" alt=""></button></div>
  <button class="btn ghost listbtn" data-go="list">📋 All 40 verbs</button>
</section>
<section class="screen" id="list" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Irregular verbs</h1><button class="btn small" id="rutoggle">Show translations</button></div>
  <div class="vtab hideru" id="vlist"></div>
</section>
<section class="screen" id="g5" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Catch It</h1><span class="hud" id="g5hud"></span><button class="btn small" id="g5pause">Pause</button></div>
  <div class="prompt" id="g5p"></div>
  <div class="field" id="g5field"><div class="catcher" id="g5duo"><svg class="basket" viewBox="0 0 100 90" aria-hidden="true"><path d="M50 4 C20 6 12 30 14 44 M50 4 C80 6 88 30 86 44" fill="none" stroke="#7A4A1C" stroke-width="6" stroke-linecap="round"/><path d="M8 42 H92 L82 86 H18 Z" fill="#C98A3E" stroke="#6E4318" stroke-width="4" stroke-linejoin="round"/><path d="M12 56 H88 M15 70 H85 M30 44 L32 86 M50 44 V86 M70 44 L68 86" stroke="#8A5A24" stroke-width="3"/><rect x="4" y="36" width="92" height="12" rx="6" fill="#E3A85C" stroke="#6E4318" stroke-width="4"/></svg><img data-img="duo" alt="Duo"></div></div>
  <p class="help">Move Duo with your mouse, finger, or the ← → keys.</p>
  <div class="say" id="g5say"><img data-img="lily" alt=""><p></p></div>
</section>

<section class="screen" id="g6" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Sort the Forms</h1><span class="hud" id="g6hud"></span></div>
  <div class="bins" id="g6bins">
    <div class="bin" data-f="v1"><h3>V1</h3><span>base form</span><div class="drop"></div></div>
    <div class="bin" data-f="v2"><h3>V2</h3><span>past simple</span><div class="drop"></div></div>
    <div class="bin" data-f="v3"><h3>V3</h3><span>past participle</span><div class="drop"></div></div>
  </div>
  <div class="scards" id="g6cards"></div>
  <div class="trrow" id="g6tr"></div>
  <div class="say" id="g6say"><img data-img="gizmo" alt=""><p></p></div>
</section>

<section class="screen" id="g7" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Type It Fast</h1><span class="hud" id="g7hud"></span></div>
  <div class="typer">
    <div class="tmach" id="g7mach"><img data-img="machine" alt="The Time Machine"><div class="steam">💨</div>
      <div class="thermo" aria-label="Machine heat"><div id="g7heat"></div></div></div>
    <div>
      <div class="prompt" id="g7p"></div>
      <div class="tbox" id="g7box"><input id="g7in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="type here"></div>
      <div class="hintline" id="g7hint"></div>
      <div class="row2"><button class="btn green" id="g7check">Check</button><button class="btn ghost" id="g7hintbtn">Hint</button></div>
      <div class="say" id="g7say"><img data-img="felix" alt=""><p></p></div>
    </div>
  </div>
</section>

<section class="screen" id="g8" hidden>
  <div class="topbar"><button class="btn small ghost" data-go="hub">🏠 Menu</button><h1>Lily’s Quiz Wheel</h1><span class="hud" id="g8hud"></span></div>
  <div class="wheelwrap">
    <div class="wheelbox"><div class="pointer">▼</div><canvas id="g8wheel" width="720" height="720"></canvas>
      <button class="btn orange spinbtn" id="g8spin">Spin!</button></div>
    <div class="qcard" id="g8q"><img data-img="lily" alt="Lily"><p class="muted">Spin the wheel to get a verb.</p></div>
  </div>
</section>

const FORMNAME={v1:'base form',v2:'past simple',v3:'past participle'};
const store={get(k,d){try{const v=localStorage.getItem('tlv_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tlv_'+k,JSON.stringify(v))}catch(e){}}};
const S={mode:store.get('mode','v2'),set:store.get('set','all'),sound:store.get('sound',true)};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return S.set==='a'?VERBS.slice(0,20):S.set==='b'?VERBS.slice(20):VERBS.slice()}
function deck(){let d=[];return()=>{if(!d.length)d=shuffle(pool());return d.pop()}}
function pickForm(){return S.mode==='mix'?(Math.random()<.5?'v2':'v3'):S.mode}
function regular(b){if(b.endsWith('e'))return b+'d';if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ied';return b+'ed'}
function wrongs(v,f,n){
  const bad=new Set([v[f],...v[f].split(' / ')]);
  const other=f==='v2'?v.v3:v.v2;
  let c=[regular(v.b),v.b];if(S.mode!=='v2')c.push(other);
  if(v.b==='be')c.push('beed','is','are');
  c.push(regular(v.v2.split(' / ')[0]));
  c=shuffle(c.slice(0,3)).concat(c.slice(3));
  const out=[];
  for(const x of c){if(out.length>=n)break;if(!bad.has(x)&&!out.includes(x))out.push(x)}
  let guard=0;
  while(out.length<n&&guard++<200){const w=pick(VERBS)[f];if(!bad.has(w)&&!out.includes(w))out.push(w)}
  return out;
}
function accepts(v,f,t){
  t=t.toLowerCase().replace(/\s+/g,' ').trim();
  const parts=v[f].split(' / ');
  return parts.includes(t)||t.replace(/\s/g,'')===parts.join('/');
}
function modeForms(){return S.mode==='v2'?['v1','v2']:S.mode==='v3'?['v1','v3']:['v1','v2','v3']}
function formsLine(v){return (S.mode==='v2'?['v1','v2']:['v1','v2','v3']).map(k=>k==='v1'?v.b:v[k]).join(' – ')}
function trBtn(v){return `<button class="tr" type="button" data-ru="${v.ru}">Translate</button>`}
function promptHTML(v,f,askText){
  return `<div class="pv"><span class="emo" aria-hidden="true">${v.e}</span><span class="base">${v.b}</span>${trBtn(v)}</div>`+
    (f?`<div class="ask">${askText||FORMNAME[f]+'?'}</div>`:'');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.tr');if(!b)return;
  e.stopPropagation();
  if(b.classList.toggle('on'))b.textContent=b.dataset.ru;else b.textContent='Translate';
},true);

/* sound */
let AC;
function tone(fr,d,type='sine',t0=0,vol=.13){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr;const t=AC.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok(){tone(660,.12,'triangle');tone(990,.2,'triangle',.1)},bad(){tone(190,.28,'sawtooth',0,.06)},pop(){tone(1100,.07,'square',0,.05)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.12))}};
const PRAISE=['Great!','Super!','Yes!','Well done!','Brilliant!','Cool!','Correct!','Nice one!'];

/* say bubble */
function say(id,html,kind){const el=$(id);el.className='say'+(kind?' '+kind:'');$('p',el).innerHTML=html||''}

/* screens */
const GAMES={};let current=null;
function show(id){
  if(current&&GAMES[current]&&GAMES[current].stop)GAMES[current].stop();
  $$('.screen').forEach(s=>s.hidden=s.id!==id);
  $('#over').hidden=true;
  current=id;window.scrollTo(0,0);
  if(GAMES[id])GAMES[id].start();
}

/* finish + movement break */
const BREAKS=['Jump 5 times like Duo! 🐶','Do 5 star jumps! ⭐','Touch your toes 5 times! 🦶','Run on the spot for 10 seconds! 🏃','Swim with your arms for 10 seconds! 🏊','Stretch up high and count to 5! 🙌','Spin around 3 times like the Time Machine! 🌀','Hop on one leg 5 times! 🦵','Clap 10 times as fast as you can! 👏','Jump forward, then jump back, 5 times! ↔️'];
let lastBreak=-1;
function finish({title,text,img='duo',again}){
  let i;do{i=rnd(BREAKS.length)}while(i===lastBreak);lastBreak=i;
  const o=$('#over');
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><img src="${IMG[img]}" alt=""><h2>${title}</h2><p class="res">${text}</p><div class="brk"><b>Duo break</b><span>${BREAKS[i]}</span></div><div class="row"><button class="btn orange" id="again">Play again</button><button class="btn ghost" data-go="hub">Menu</button></div></div>`;
  o.hidden=false;sfx.win();
  $('#again').onclick=()=>{o.hidden=true;again()};
}

/* ===== 5 Catch It ===== */
GAMES.g5=(()=>{
  const TARGETS=10,BX=89;let raf,next,v,f,caught,miss,chips,spawnT,since,duoX,keys={},last,paused,wrongHere,busy;
  const field=()=>$('#g5field'),duo=()=>$('#g5duo');
  function hud(){$('#g5hud').textContent=`🧺 ${caught} / ${TARGETS}`}
  function stop(){cancelAnimationFrame(raf)}
  function start(){
        next=deck();caught=0;miss=0;chips&&chips.forEach(c=>c.el.remove());chips=[];paused=false;$('#g5pause').textContent='Pause';
    duoX=field().clientWidth/2;hud();target();last=performance.now();raf=requestAnimationFrame(tick);
  }
  function target(){
    if(caught>=TARGETS){cancelAnimationFrame(raf);return finish({title:'Great catching!',text:`Duo caught ${TARGETS} right answers. Wrong catches: ${miss}.`,again:start})}
    v=next();f=pickForm();since=0;spawnT=.3;wrongHere=0;busy=false;
    $('#g5p').innerHTML=promptHTML(v,f);say('#g5say',`Catch the <b>${FORMNAME[f]}</b> of <b>${v.b}</b>!`);
  }
  function spawn(){
    const W=field().clientWidth,ok=since>=2||Math.random()<.35;since=ok?0:since+1;
    const t=ok?v[f]:pick(wrongs(v,f,3));const el=document.createElement('div');el.className='chip';el.textContent=t;field().append(el);
    const w=el.offsetWidth;chips.push({el,t,ok,w,x:10+Math.random()*Math.max(10,W-w-20),y:-50,sp:75+Math.random()*35,dead:false});
  }
  function tick(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!paused){
      const F=field(),W=F.clientWidth,H=F.clientHeight,d=duo();
      if(keys.l)duoX-=430*dt;if(keys.r)duoX+=430*dt;duoX=Math.max(BX,Math.min(W-(d.offsetWidth-BX),duoX));
      d.style.transform=`translateX(${duoX-BX}px)`;
      if(!busy){spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.1}}
      const fr=F.getBoundingClientRect(),br=$('.basket',d).getBoundingClientRect(),bTop=br.top-fr.top+br.height*.4,half=br.width/2;
      for(const c of chips){if(c.dead)continue;c.y+=c.sp*dt;c.el.style.transform=`translate(${c.x}px,${c.y}px)`;
        const cx=c.x+c.w/2;
        if(!busy&&c.y+30>=bTop&&c.y<bTop+30&&Math.abs(cx-duoX)<half+c.w*.3){c.dead=true;c.el.classList.add('gone');setTimeout(()=>c.el.remove(),300);catchIt(c)}
        else if(c.y>H){c.dead=true;c.el.remove()}}
      chips=chips.filter(c=>!c.dead||c.el.isConnected);
    }
    raf=requestAnimationFrame(tick);
  }
  function catchIt(c){
    if(c.ok){caught++;hud();sfx.ok();busy=true;say('#g5say',`${pick(PRAISE)} ${v.b} → <b>${c.t}</b>`,'good');
      chips.forEach(x=>{if(!x.dead){x.dead=true;x.el.classList.add('gone');setTimeout(()=>x.el.remove(),300)}});setTimeout(target,1000)}
    else{miss++;wrongHere++;sfx.bad();const d=duo();d.classList.remove('oops');void d.offsetWidth;d.classList.add('oops');
      say('#g5say',wrongHere>=2?`Not <b>${c.t}</b>. Look for <b>${v[f]}</b>!`:`Oops, <b>${c.t}</b> is wrong. Try again!`,'bad')}
  }
  const move=e=>{const r=field().getBoundingClientRect();duoX=e.clientX-r.left};
  $('#g5field').addEventListener('pointermove',move);$('#g5field').addEventListener('pointerdown',move);
  addEventListener('keydown',e=>{if(current!=='g5')return;if(e.key==='ArrowLeft'||e.key==='a'){keys.l=true;e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'){keys.r=true;e.preventDefault()}});
  addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false});
  $('#g5pause').onclick=()=>{paused=!paused;$('#g5pause').textContent=paused?'Go!':'Pause'};
  return{start,stop};
})();

/* ===== 6 Sort the Forms ===== */
GAMES.g6=(()=>{
  const ROUNDS=4;let PER=3,FORMS,next,round,verbs,filled,placed,mistakes,sel,drag,timer;
  function hud(){$('#g6hud').textContent=`Round ${round} / ${ROUNDS}`}
  function stop(){clearTimeout(timer)}
  function start(){next=deck();round=0;mistakes=0;FORMS=modeForms();PER=FORMS.length===2?4:3;
    $$('#g6bins .bin').forEach(b=>b.hidden=!FORMS.includes(b.dataset.f));$('#g6bins').classList.toggle('two',FORMS.length===2);newRound()}
  function newRound(){
    if(round>=ROUNDS)return finish({title:'All sorted!',text:mistakes?`Mistakes: ${mistakes}. Good work!`:'No mistakes at all. Amazing!',img:'gizmo',again:start});
    round++;hud();filled={};placed=0;sel=null;verbs=[];
    while(verbs.length<PER){const v=next();if(!verbs.includes(v))verbs.push(v)}
    $$('#g6bins .drop').forEach(d=>d.innerHTML='');
    const cards=[];verbs.forEach((v,i)=>FORMS.forEach(k=>cards.push({vi:i,t:k==='v1'?v.b:v[k]})));
    $('#g6cards').innerHTML=shuffle(cards).map(c=>`<div class="scard" role="button" tabindex="0" data-vi="${c.vi}" data-t="${c.t}"><span>${verbs[c.vi].e}</span>${c.t}</div>`).join('');
    $('#g6tr').innerHTML=verbs.map(v=>`<div class="pv"><span class="emo">${v.e}</span><span class="base">${v.b}</span>${trBtn(v)}</div>`).join('');
    say('#g6say',round===1?`Drag each card into ${FORMS.map(x=>x.toUpperCase()).join(FORMS.length===2?' or ':', ').replace(/, (V3)$/,' or $1')}. Or tap a card, then tap a box.`:`Round ${round}. Let’s sort!`);
  }
  function tryDrop(card,f){
    const v=verbs[+card.dataset.vi],t=card.dataset.t,key=v.b+f,right=(f==='v1'?v.b:v[f])===t;
    if(right&&!filled[key]){
      filled[key]=1;placed++;card.classList.remove('sel');card.removeAttribute('tabindex');card.classList.add('placed');
      $(`#g6bins .bin[data-f="${f}"] .drop`).append(card);sfx.ok();sel=null;
      say('#g6say',`${pick(PRAISE)} <b>${t}</b> is ${f.toUpperCase()} of <b>${v.b}</b>.`,'good');
      if(placed===PER*FORMS.length){sfx.win();timer=setTimeout(newRound,1300)}
    }else{
      mistakes++;sfx.bad();card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      const bin=$(`#g6bins .bin[data-f="${f}"]`);bin.classList.add('flash');setTimeout(()=>bin.classList.remove('flash'),500);
      say('#g6say',`<b>${t}</b> doesn’t go in ${f.toUpperCase()}. Try another box!`,'bad');
    }
  }
  const cardsEl=$('#g6cards');
  cardsEl.addEventListener('pointerdown',e=>{const c=e.target.closest('.scard');if(!c)return;e.preventDefault();drag={c,x0:e.clientX,y0:e.clientY,moved:false}});
  addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(!drag.moved&&Math.hypot(dx,dy)>8){drag.moved=true;drag.c.classList.add('dragging')}
    if(drag.moved){drag.c.style.transform=`translate(${dx}px,${dy}px)`;const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');$$('#g6bins .bin').forEach(x=>x.classList.toggle('hover',x===b))}});
  addEventListener('pointerup',e=>{if(!drag)return;const{c,moved}=drag;drag=null;c.classList.remove('dragging');c.style.transform='';$$('#g6bins .bin').forEach(x=>x.classList.remove('hover'));
    if(moved){const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');if(b)tryDrop(c,b.dataset.f)}
    else{if(sel===c){c.classList.remove('sel');sel=null}else{sel&&sel.classList.remove('sel');sel=c;c.classList.add('sel')}}});
  cardsEl.addEventListener('keydown',e=>{const c=e.target.closest('.scard');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel&&sel.classList.remove('sel');sel=c;c.classList.add('sel')}});
  $$('#g6bins .bin').forEach(b=>b.addEventListener('click',()=>{if(sel)tryDrop(sel,b.dataset.f)}));
  return{start,stop};
})();

/* ===== 7 Type It Fast ===== */
GAMES.g7=(()=>{
  const Q=10,TIME=25;let raf,next,v,f,heat,n,right,hints,locked,timer,last;
  const inp=()=>$('#g7in');
  function hud(){$('#g7hud').textContent=`✔ ${right}  Question ${Math.min(n,Q)} / ${Q}`}
  function stop(){cancelAnimationFrame(raf);clearTimeout(timer)}
  function start(){next=deck();n=0;right=0;q();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
  function q(){
    if(n>=Q){cancelAnimationFrame(raf);return finish({title:'Machine cooled down!',text:`You typed ${right} of ${Q} right.`,img:'machine',again:start})}
    n++;hud();v=next();f=pickForm();heat=0;hints=0;locked=false;
    $('#g7p').innerHTML=promptHTML(v,f);$('#g7hint').textContent='';$('#g7box').className='tbox';$('#g7mach').classList.remove('hot');
    const i=inp();i.value='';i.disabled=false;i.focus();
    say('#g7say',`Type the <b>${FORMNAME[f]}</b> before the Machine gets too hot!`);
  }
  function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!locked){heat+=dt/TIME*100;$('#g7heat').style.height=Math.min(100,heat)+'%';
      if(heat>=100){locked=true;inp().disabled=true;$('#g7mach').classList.add('hot');sfx.bad();say('#g7say',`Too hot! The answer is <b>${v[f]}</b>.`,'bad');timer=setTimeout(q,2400)}}
    raf=requestAnimationFrame(tick)}
  function check(){
    if(locked)return;const t=inp().value;if(!t.trim())return inp().focus();
    if(accepts(v,f,t)){locked=true;right++;hud();sfx.ok();$('#g7box').className='tbox good';heat=0;$('#g7heat').style.height='0%';
      say('#g7say',`${pick(PRAISE)} <b>${formsLine(v)}</b>`,'good');timer=setTimeout(q,1500)}
    else{sfx.bad();const b=$('#g7box');b.className='tbox bad';void b.offsetWidth;b.classList.add('shake');say('#g7say','Not quite. Check the spelling and try again!','bad');inp().select()}
  }
  function hint(){if(locked)return;const a=v[f].split(' / ')[0];hints=Math.min(a.length-1,hints+1);
    $('#g7hint').textContent=a.split('').map((ch,i)=>i<hints?ch:'_').join(' ');inp().focus()}
  $('#g7check').onclick=check;$('#g7hintbtn').onclick=hint;
  $('#g7in').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  return{start,stop};
})();

/* ===== 8 Lily's Quiz Wheel ===== */
GAMES.g8=(()=>{
  const N=8,COLS=['#F7A04B','#6FB2EC','#7CCB62','#FFD95A','#F2766D','#B48BEB','#5FD0C0','#F59CC8'];
  let segs,used,rot=0,spinning,score,spins,cur,curF,timer;
  const cv=()=>$('#g8wheel');
  function hud(){$('#g8hud').textContent=`⭐ ${score}  Spins: ${spins} / ${N}`}
  function stop(){clearTimeout(timer)}
  function draw(){
    const c=cv(),x=c.getContext('2d'),R=c.width/2;x.clearRect(0,0,c.width,c.height);
    segs.forEach((v,i)=>{const a0=(i*360/N-90)*Math.PI/180,a1=((i+1)*360/N-90)*Math.PI/180;
      x.beginPath();x.moveTo(R,R);x.arc(R,R,R-8,a0,a1);x.closePath();x.fillStyle=used[i]?'#B8C2CC':COLS[i];x.fill();x.lineWidth=6;x.strokeStyle='#fff';x.stroke();
      x.save();x.translate(R,R);x.rotate((a0+a1)/2);x.textAlign='right';x.textBaseline='middle';
      x.fillStyle=used[i]?'#6B7783':'#1B2B3A';x.font='52px sans-serif';x.textAlign='center';x.fillText(used[i]?'✔':v.e,R-62,2);
      x.textAlign='right';x.font='900 40px Nunito, Arial, sans-serif';x.fillText(v.b,R-104,2);x.restore()});
    x.beginPath();x.arc(R,R,56,0,Math.PI*2);x.fillStyle='#2E5476';x.fill();x.lineWidth=8;x.strokeStyle='#fff';x.stroke();
    x.fillStyle='#fff';x.font='44px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('⏱️',R,R+2);
  }
  function start(){segs=shuffle(pool()).slice(0,N);used=Array(N).fill(false);score=0;spins=0;spinning=false;hud();draw();
    $('#g8spin').disabled=false;$('#g8q').innerHTML=`<img src="${IMG.lily}" alt="Lily"><p class="bigq">Spin the wheel to get a verb!</p><p class="muted">Say the answer out loud, then check it.</p>`}
  function spin(){
    if(spinning)return;const left=used.map((u,i)=>u?-1:i).filter(i=>i>=0);if(!left.length)return;
    spinning=true;$('#g8spin').disabled=true;const t=pick(left);cur=segs[t];curF=pickForm();
    const center=(t+.5)*360/N;let delta=((-center-rot)%360+360)%360;rot+=360*5+delta;
    cv().style.transform=`rotate(${rot}deg)`;tone(500,.05,'square',0,.04);
    timer=setTimeout(()=>{used[t]=true;spins++;hud();ask()},3900);
  }
  function ask(){
    const q=$('#g8q');
    q.innerHTML=`<img src="${IMG.lily}" alt="Lily"><p class="bigq">Say the <b>${FORMNAME[curF]}</b>!</p><div class="pv"><span class="emo">${cur.e}</span><span class="base">${cur.b}</span>${trBtn(cur)}</div><button class="btn" id="g8show">Show answer</button>`;
    $('#g8show').onclick=()=>{
      const fm=k=>`<span class="${k===curF?'hl':''}">${k==='v1'?cur.b:cur[k]}</span>`;
      q.innerHTML=`<img src="${IMG.lily}" alt="Lily"><div class="pv"><span class="emo">${cur.e}</span>${trBtn(cur)}</div><p class="forms">${(S.mode==='v2'?['v1','v2']:['v1','v2','v3']).map(fm).join(' – ')}</p>`+
        `<p class="bonus">${curF==='v2'?`Bonus: make a sentence! <i>Yesterday I ${cur.v2.split(' / ')[0]} …</i>`:'Bonus: say all three forms out loud!'}</p>`+
        `<div class="row2"><button class="btn green" id="g8yes">I said it right ✅</button><button class="btn ghost" id="g8no">Not yet</button></div>`;
      const done=ok=>{if(ok){score++;sfx.ok()}hud();draw();spinning=false;
        if(spins>=N)return finish({title:'Wheel finished!',text:`You got ${score} out of ${N}.`,img:'lily',again:start});
        $('#g8spin').disabled=false;q.innerHTML=`<img src="${IMG.lily}" alt="Lily"><p class="bigq">${ok?pick(PRAISE):'That’s OK!'} Spin again!</p>`};
      $('#g8yes').onclick=()=>done(true);$('#g8no').onclick=()=>done(false);
    };
  }
  $('#g8spin').onclick=spin;
  return{start,stop};
})();

initCore();</script></body></html>
